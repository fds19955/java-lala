stages:
  - build
  - deploy

build:
  stage: build
  image: docker:24.0.7
  services:
    - docker:24.0.7-dind
  variables:
    DOCKER_TLS_CERTDIR: ""  # 禁用TLS，使用HTTP连接
    IMAGE_NAME: "$CI_REGISTRY/fds/java-lala:latest"
    DOCKER_HOST: tcp://docker:2375
    DOCKER_DRIVER: overlay2
  script:
    # 使用heredoc语法，完全避免引号问题
    - cat > /etc/docker/daemon.json << EOF
      { "insecure-registries": ["$CI_REGISTRY"] }
      EOF
    - systemctl restart docker || true
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY --insecure-registry
    - docker build -t $IMAGE_NAME ./backend
    - docker push $IMAGE_NAME
  only:
    - feature/initial-commit

deploy:
  stage: deploy
  image: ubuntu:22.04
  before_script:
    - apt update && apt install -y openssh-client docker.io docker-compose
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan $DEPLOY_SERVER >> ~/.ssh/known_hosts
  script:
    - scp docker-compose.yml $DEPLOY_USER@$DEPLOY_SERVER:/home/ubuntu/article-fds/
    - ssh $DEPLOY_USER@$DEPLOY_SERVER "cd /home/ubuntu/article-fds && docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY --insecure-registry"
    - ssh $DEPLOY_USER@$DEPLOY_SERVER "cd /home/ubuntu/article-fds && docker compose up -d --pull always"
  only:
    - feature/initial-commit
