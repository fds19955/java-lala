# 全栈应用CI/CD流水线
stages:
  - test
  - build
  - deploy

variables:
  # 镜像标签使用commit hash，确保唯一性
  BACKEND_IMAGE: "article-backend:$CI_COMMIT_SHORT_SHA"
  FRONTEND_IMAGE: "article-frontend:$CI_COMMIT_SHORT_SHA"
  DOCKER_HOST: "tcp://docker:2375"

# 使用Docker-in-Docker
services:
  - docker:20.10.16-dind

# 缓存依赖，加速构建
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - backend/.m2/repository
    - frontend/node_modules/

# 1. 后端代码测试
backend-test:
  stage: test
  image: maven:3.8.6-openjdk-17
  script:
    - cd backend
    - mvn clean test
  only:
    - main
  tags:
    - docker

# 2. 前端代码测试（如果有）
frontend-test:
  stage: test
  image: node:16-alpine
  script:
    - cd frontend
    - npm install
    - npm run test -- --watchAll=false
  only:
    - main
  tags:
    - docker

# 3. 构建后端Docker镜像
build-backend:
  stage: build
  image: docker:20.10.16
  script:
    - cd backend
    - docker build -t $BACKEND_IMAGE .
    - docker images
  artifacts:
    paths:
      - backend/target/*.jar
  only:
    - main
  tags:
    - docker

# 4. 构建前端Docker镜像  
build-frontend:
  stage: build
  image: docker:20.10.16
  script:
    - cd frontend
    - docker build -t $FRONTEND_IMAGE .
    - docker images
  only:
    - main
  tags:
    - docker

# 5. 部署到服务器（核心步骤）
deploy-production:
  stage: deploy
  image: docker:20.10.16
  before_script:
    - apk add --no-cache docker-compose
  script:
    # 生成生产环境docker-compose文件
    - |
      cat > docker-compose.prod.yml << EOF
      version: '3.8'
      services:
        mysql-db:
          image: mysql:8.0
          container_name: article-mysql
          restart: unless-stopped
          environment:
            MYSQL_ROOT_PASSWORD: fds00913
            MYSQL_DATABASE: article_db
            TZ: Asia/Shanghai
          ports:
            - "3306:3306"
          volumes:
            - /home/ubuntu/mysql/data:/var/lib/mysql
          networks:
            - app-network

        redis:
          image: redis:alpine
          container_name: article-redis
          command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
          ports:
            - "6379:6379"
          networks:
            - app-network

        backend-app:
          image: $BACKEND_IMAGE
          container_name: article-backend
          restart: unless-stopped
          ports:
            - "8080:8080"
          environment:
            SPRING_PROFILES_ACTIVE: prod
            SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/article_db?useSSL=false&serverTimezone=Asia/Shanghai
            SPRING_DATASOURCE_USERNAME: root
            SPRING_DATASOURCE_PASSWORD: fds00913
          depends_on:
            - mysql-db
            - redis
          networks:
            - app-network

        frontend-app:
          image: $FRONTEND_IMAGE
          container_name: article-frontend
          restart: unless-stopped
          ports:
            - "80:80"
          depends_on:
            - backend-app
          networks:
            - app-network

      networks:
        app-network:
          driver: bridge
      EOF
    
    # 停止旧容器并启动新容器
    - docker-compose -f docker-compose.prod.yml down
    - docker-compose -f docker-compose.prod.yml up -d
    
    # 健康检查
    - sleep 30
    - docker ps
    - echo "部署完成！应用访问地址：http://49.233.185.174"
  only:
    - main
  tags:
    - docker
