stages:
  - build
  - deploy

build:
  stage: build
  image: maven:3.9.8-eclipse-temurin-17
  script:
    - cd backend  # 必须先进入backend子目录
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - backend/target/app.jar  # 注意JAR包路径变化
  only:
    - feature/initial-commit

deploy:
  stage: deploy
  image: ubuntu:22.04
  before_script:
    - apt update && apt install -y openssh-client docker.io docker-compose
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan $DEPLOY_SERVER >> ~/.ssh/known_hosts
  script:
    - scp -r ./* $DEPLOY_USER@$DEPLOY_SERVER:/home/ubuntu/article-fds/
    - ssh $DEPLOY_USER@$DEPLOY_SERVER "cd /home/ubuntu/article-fds && docker compose up -d --build"
  only:
    - feature/initial-commit
