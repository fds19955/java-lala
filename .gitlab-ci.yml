stages:
  - build-backend
  - build-frontend
  - deploy-mysql
  - deploy

variables:
  DOCKER_HOST: "unix:///var/run/docker.sock"
  DOCKER_TLS_CERTDIR: ""
  MYSQL_ROOT_PASSWORD: "fds00913"
  MYSQL_DATABASE: "article_db"

# 阶段1：构建后端（不变）
build-backend:
  stage: build-backend
  image: maven:3.9.8-eclipse-temurin-17
  script:
    - |
      mkdir -p ~/.m2
      cat > ~/.m2/settings.xml << 'EOF'
      <?xml version="1.0" encoding="UTF-8"?>
      <settings>
        <mirrors>
          <mirror>
            <id>alimaven</id>
            <name>aliyun maven</name>
            <url>https://maven.aliyun.com/repository/public</url> 
            <mirrorOf>central</mirrorOf>
          </mirror>
        </mirrors>
      </settings>
      EOF
      
      cd backend
      mvn clean package -DskipTests
      ls -lh target/
  artifacts:
    paths:
      - backend/target/*.jar
  only:
    - feature/initial-commit
  tags:
    - docker

# 阶段2：构建前端（不变）
build-frontend:
  stage: build-frontend
  image: node:20-alpine
  script:
    - echo "📦 开始构建前端..."
    - cd frontend
    - npm install --registry=https://registry.npmmirror.com 
    - npm run build
    - ls -lh dist/
  artifacts:
    paths:
      - frontend/dist/
  only:
    - feature/initial-commit
  tags:
    - docker

# 阶段3：部署数据库（关键修复）
deploy-mysql:
  stage: deploy-mysql
  image: docker:24.0.7
  script:
    - |
      echo "========== 部署数据库 =========="
      
      # 1. 创建专用网络（如果不存在）
      if ! docker network ls | grep -q article-fds_article-net; then
        echo "创建专用网络..."
        docker network create article-fds_article-net
      fi
      
      # 2. 创建数据卷（如果不存在）
      if ! docker volume ls | grep -q mysql-data; then
        echo "创建MySQL数据卷..."
        docker volume create mysql-data
      fi
      
      if ! docker volume ls | grep -q redis-data; then
        echo "创建Redis数据卷..."
        docker volume create redis-data
      fi
      
      # 3. 部署MySQL容器
      if ! docker ps --format "{{.Names}}" | grep -q "article-mysql"; then
        echo "⚠️ MySQL容器不存在，创建新容器..."
        
        # 启动MySQL（使用数据卷）
        docker run -d \
          --name article-mysql \
          --restart unless-stopped \
          --network article-fds_article-net \
          -p 3306:3306 \
          -e MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD \
          -e MYSQL_DATABASE=$MYSQL_DATABASE \
          -v mysql-data:/var/lib/mysql \
          mysql:8.0
        
        # 等待MySQL初始化
        echo "等待数据库启动..."
        i=1
        while [ $i -le 20 ]; do
          if docker exec article-mysql mysql -uroot -p$MYSQL_ROOT_PASSWORD -e "SELECT 1" > /dev/null 2>&1; then
            echo "✅ MySQL容器已就绪（$i秒）"
            break
          fi
          echo "初始化中...($i/20)"
          sleep 3
          i=$((i + 1))
        done
        
        # 检查启动状态
        if ! docker exec article-mysql mysql -uroot -p$MYSQL_ROOT_PASSWORD -e "SELECT 1" > /dev/null 2>&1; then
          echo "❌ MySQL启动失败，查看日志："
          docker logs article-mysql --tail 20
          exit 1
        fi
      else
        echo "✅ MySQL容器已运行"
      fi
      
      # 4. 部署Redis容器
      if ! docker ps --format "{{.Names}}" | grep -q "article-redis"; then
        echo "⚠️ Redis容器不存在，创建新容器..."
        docker run -d \
          --name article-redis \
          --restart unless-stopped \
          --network article-fds_article-net \
          -p 6379:6379 \
          -v redis-data:/data \
          redis:alpine
      else
        echo "✅ Redis容器已运行"
      fi
      
      echo "========== 数据库部署完成 =========="
  tags:
    - docker

# 阶段4：部署前后端（不变）
deploy:
  stage: deploy
  image: docker:24.0.7
  needs: ["build-backend", "build-frontend", "deploy-mysql"]
  script:
    - |
      echo "========== 开始部署应用 =========="
      
      # 1. 部署后端
      echo "🚀 部署后端服务..."
      
      # 确认有JAR文件
      echo "查找JAR文件..."
      if ls backend/target/*.jar 1>/dev/null 2>&1; then
        JAR_FILE=$(ls backend/target/*.jar | head -1)
        echo "✅ 找到JAR文件: $JAR_FILE"
      else
        echo "❌ 错误：没有找到JAR文件"
        exit 1
      fi
      
      # 创建后端Dockerfile
      cat > Dockerfile << 'EOF'
      FROM eclipse-temurin:17-jre
      WORKDIR /app
      COPY backend/target/*.jar app.jar
      EXPOSE 8080
      ENTRYPOINT ["java", "-jar", "app.jar"]
      EOF
      
      # 构建后端镜像
      echo "📦 构建Docker镜像..."
      docker build -t article-backend:latest .
      
      # 停止旧容器
      echo "🧹 停止旧版本应用..."
      docker stop article-backend 2>/dev/null || true
      docker rm article-backend 2>/dev/null || true
      
      # 启动新后端容器
      echo "🚢 启动新应用..."
      docker run -d \
        --name article-backend \
        --restart unless-stopped \
        -p 8081:8080 \
        --network article-fds_article-net \
        -e SPRING_PROFILES_ACTIVE=prod \
        -e SPRING_DATASOURCE_URL='jdbc:mysql://article-mysql:3306/article_db?useSSL=false&serverTimezone=Asia/Shanghai' \
        -e SPRING_DATASOURCE_USERNAME=root \
        -e SPRING_DATASOURCE_PASSWORD=fds00913 \
        -e SPRING_REDIS_HOST='article-redis' \
        -e SPRING_REDIS_PORT=6379 \
        -e SERVER_PORT=8080 \
        -e LOGGING_LEVEL_ROOT=info \
        -e JAVA_OPTS='-Xmx512m -Xms256m' \
        article-backend:latest
      
      # 2. 部署前端
      echo "🚀 部署前端服务..."
      
      # 创建前端Dockerfile
      cat > frontend/Dockerfile << 'EOF'
      FROM nginx:alpine
      COPY dist /usr/share/nginx/html
      EXPOSE 80
      CMD ["nginx", "-g", "daemon off;"]
      EOF
      
      # 构建前端镜像
      docker build -t article-frontend:latest frontend/
      
      # 停止旧前端容器
      docker stop article-frontend 2>/dev/null || true
      docker rm article-frontend 2>/dev/null || true
      
      # 启动新前端容器
      docker run -d \
        --name article-frontend \
        --restart unless-stopped \
        -p 80:80 \
        --network article-fds_article-net \
        article-frontend:latest
      
      # 3. 健康检查（略）
  only:
    - feature/initial-commit
  tags:
    - docker
