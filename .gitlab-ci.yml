stages:
  - build
  - deploy

build:
  stage: build
  image: maven:3.9.8-eclipse-temurin-17
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  before_script:
    - apt update && apt install -y docker.io
    - mkdir -p /etc/docker
    # 🔴 关键：用Heredoc完全规避YAML解析问题
    - cat > /etc/docker/daemon.json << 'EOF'
{"insecure-registries": ["49.233.185.174:5000", "article-gitlab:5000"]}
EOF
    # 🔴 关键：不用systemctl，直接重启Docker服务的正确方式
    - service docker restart
  script:
    - cd backend
    - mvn clean package -DskipTests
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin 49.233.185.174:5000
    - docker build -t 49.233.185.174:5000/fds/java-lala:latest .
    - docker push 49.233.185.174:5000/fds/java-lala:latest
  only:
    - feature/initial-commit
  tags:
    - docker
  cache:
    paths:
      - .m2/repository/

deploy:
  stage: deploy
  image: ubuntu:22.04
  before_script:
    - apt update && apt install -y docker.io docker-compose openssh-client
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan 49.233.185.174 >> ~/.ssh/known_hosts
  script:
    - ssh root@49.233.185.174 "mkdir -p /home/ubuntu/article-fds"
    - scp docker-compose.yml root@49.233.185.174:/home/ubuntu/article-fds/
    - ssh root@49.233.185.174 "cd /home/ubuntu/article-fds && docker-compose up -d"
  only:
    - feature/initial-commit
  tags:
    - docker
