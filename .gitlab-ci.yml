 
# .gitlab-ci.yml - 企业级CI/CD配置
---
stages:
  - build
  - test
  - deploy

variables:
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  COMPOSE_PROJECT_NAME: "article-system"
  MYSQL_ROOT_PASSWORD: "fds00913"

cache:
  paths:
    - backend/target/
    - frontend/node_modules/

# 使用Docker-in-Docker服务
services:
  - docker:24.0.7-dind

# 阶段1：构建后端
build-backend:
  stage: build
  image: maven:3.9.8-eclipse-temurin-17
  script:
    - |
      # 配置Maven镜像
      mkdir -p ~/.m2
      cat > ~/.m2/settings.xml << 'EOF'
      <?xml version="1.0" encoding="UTF-8"?>
      <settings>
        <mirrors>
          <mirror>
            <id>alimaven</id>
            <name>aliyun maven</name>
            <url>https://maven.aliyun.com/repository/public</url>
            <mirrorOf>central</mirrorOf>
          </mirror>
        </mirrors>
      </settings>
      EOF
      
      # 构建后端
      cd backend
      mvn clean package -DskipTests -Dmaven.test.skip=true
      
      # 验证构建结果
      ls -lh target/*.jar
      echo "后端构建完成，JAR文件大小: $(du -h target/*.jar | cut -f1)"
  artifacts:
    paths:
      - backend/target/*.jar
    expire_in: 1 week
  only:
    - feature/initial-commit
  tags:
    - docker

# 阶段2：构建前端
build-frontend:
  stage: build
  image: node:20-alpine
  script:
    - |
      echo "开始构建前端..."
      
      cd frontend
      
      # 配置npm镜像
      npm config set registry https://registry.npmmirror.com
      npm config get registry
      
      # 安装依赖并构建
      npm ci --only=production
      npm run build
      
      # 验证构建结果
      ls -lh dist/
      echo "前端构建完成，文件数量: $(find dist/ -type f | wc -l)"
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week
  only:
    - feature/initial-commit
  tags:
    - docker

# 阶段3：部署（使用Docker Compose）
deploy:
  stage: deploy
  image: docker/compose:1.29.2
  script:
    - |
      echo "========== 开始企业级部署 =========="
      echo "部署时间: $(date)"
      echo "Git提交: $CI_COMMIT_SHORT_SHA"
      
      # 1. 环境检查
      echo ""
      echo "1. 环境检查..."
      docker --version
      docker-compose --version
      echo "Docker Compose项目名: $COMPOSE_PROJECT_NAME"
      
      # 2. 停止旧服务（如果有）
      echo ""
      echo "2. 清理旧服务..."
      docker-compose down --remove-orphans --timeout 30 2>/dev/null || true
      echo "清理完成"
      
      # 3. 构建镜像（使用缓存）
      echo ""
      echo "3. 构建Docker镜像..."
      docker-compose build --pull --no-cache
      echo "镜像构建完成"
      
      # 4. 启动全部服务
      echo ""
      echo "4. 启动所有服务..."
      docker-compose up -d
      
      # 5. 检查服务状态
      echo ""
      echo "5. 初始状态检查..."
      sleep 10  # 给容器一些启动时间
      docker-compose ps
      
      # 6. 健康检查（三层检查法）
      echo ""
      echo "6. 执行健康检查..."
      
      # 6.1 MySQL健康检查
      echo "检查MySQL..."
      MYSQL_HEALTHY=false
      for i in {1..15}; do
        if docker-compose exec -T mysql mysqladmin -uroot -p"$MYSQL_ROOT_PASSWORD" ping 2>/dev/null | grep -q "alive"; then
          MYSQL_HEALTHY=true
          echo "✅ MySQL健康（第${i}次检查）"
          break
        fi
        echo "等待MySQL启动...($i/15)"
        sleep 3
      done
      
      # 6.2 Redis健康检查
      echo "检查Redis..."
      REDIS_HEALTHY=false
      for i in {1..10}; do
        if docker-compose exec -T redis redis-cli ping 2>/dev/null | grep -q "PONG"; then
          REDIS_HEALTHY=true
          echo "✅ Redis健康（第${i}次检查）"
          break
        fi
        echo "等待Redis启动...($i/10)"
        sleep 2
      done
      
      # 6.3 后端健康检查
      echo "检查后端应用..."
      BACKEND_HEALTHY=false
      for i in {1..20}; do
        # 两种方式检查：内部健康端点 + 外部API
        INTERNAL_CHECK=$(docker-compose exec -T backend curl -s -f http://localhost:8080/actuator/health 2>/dev/null || echo "FAILED")
        EXTERNAL_CHECK=$(curl -s -o /dev/null -w "%{http_code}" "http://49.233.185.174:8081/actuator/health" --max-time 5 2>/dev/null || echo "000")
        
        if echo "$INTERNAL_CHECK" | grep -q '"status":"UP"' || [ "$EXTERNAL_CHECK" = "200" ]; then
          BACKEND_HEALTHY=true
          echo "✅ 后端健康（第${i}次检查）"
          break
        fi
        
        # 检查启动日志
        if docker-compose logs backend --tail=5 2>/dev/null | grep -q "Started.*Application"; then
          echo "✅ 后端已启动（日志检测）"
          BACKEND_HEALTHY=true
          break
        fi
        
        echo "等待后端启动...($i/20)"
        sleep 4
      done
      
      # 6.4 前端健康检查
      echo "检查前端应用..."
      FRONTEND_HEALTHY=false
      for i in {1..10}; do
        FRONTEND_CHECK=$(curl -s -o /dev/null -w "%{http_code}" "http://49.233.185.174" --max-time 5 2>/dev/null || echo "000")
        
        if [ "$FRONTEND_CHECK" = "200" ]; then
          FRONTEND_HEALTHY=true
          echo "✅ 前端健康（第${i}次检查）"
          break
        fi
        
        echo "等待前端启动...($i/10)"
        sleep 3
      done
      
      # 7. 最终验证
      echo ""
      echo "7. 最终验证..."
      echo "最终服务状态:"
      docker-compose ps --all
      
      echo ""
      echo "📊 健康检查总结:"
      echo "  MySQL:   $([ "$MYSQL_HEALTHY" = true ] && echo "✅ 健康" || echo "⚠️ 异常")"
      echo "  Redis:   $([ "$REDIS_HEALTHY" = true ] && echo "✅ 健康" || echo "⚠️ 异常")"
      echo "  Backend: $([ "$BACKEND_HEALTHY" = true ] && echo "✅ 健康" || echo "⚠️ 异常")"
      echo "  Frontend: $([ "$FRONTEND_HEALTHY" = true ] && echo "✅ 健康" || echo "⚠️ 异常")"
      
      # 8. API功能测试
      echo ""
      echo "8. API功能测试..."
      echo "测试文章列表API..."
      API_TEST_RESULT=$(curl -s -o /dev/null -w "状态码:%{http_code} 耗时:%{time_total}s" "http://49.233.185.174:8081/api/articles" --max-time 10 2>/dev/null || echo "连接失败")
      echo "API测试结果: $API_TEST_RESULT"
      
      # 9. 最终报告
      echo ""
      echo "========== 部署完成报告 =========="
      echo "🎯 部署状态: 完成"
      echo "📅 时间: $(date)"
      echo ""
      echo "🌐 访问地址:"
      echo "  前端页面: http://49.233.185.174"
      echo "  后端API:  http://49.233.185.174:8081/api/articles"
      echo "  数据库:   49.233.185.174:3306 (账号: root)"
      echo "  缓存:     49.233.185.174:6379"
      echo ""
      echo "🛠️ 管理命令:"
      echo "  查看状态: docker-compose ps"
      echo "  查看日志: docker-compose logs -f"
      echo "  重启服务: docker-compose restart"
      echo "  停止服务: docker-compose down"
      echo ""
      echo "📈 监控信息:"
      echo "  容器数量: $(docker-compose ps --services | wc -l)"
      echo "  运行状态: $(docker-compose ps --services | xargs -I {} docker-compose ps {} | grep -c 'Up')/4 个服务运行中"
      echo ""
      echo "✅ 企业级部署完成！"
      echo "========== 结束 =========="
  needs:
    - build-backend
    - build-frontend
  only:
    - feature/initial-commit
  tags:
    - docker
  environment:
    name: production
    url: http://49.233.185.174
 
