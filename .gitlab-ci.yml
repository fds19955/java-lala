# .gitlab-ci.yml（最简单修复版）
stages:
  - build
  - deploy

variables:
  DOCKER_HOST: "unix:///var/run/docker.sock"
  DOCKER_TLS_CERTDIR: ""

# 阶段1：构建JAR（最小版）
build:
  stage: build
  image: maven:3.9.8-eclipse-temurin-17
  script:
    - |
      # 创建Maven配置（阿里云镜像）
      mkdir -p ~/.m2
      cat > ~/.m2/settings.xml << 'EOF'
      <?xml version="1.0" encoding="UTF-8"?>
      <settings>
        <mirrors>
          <mirror>
            <id>alimaven</id>
            <name>aliyun maven</name>
            <url>https://maven.aliyun.com/repository/public</url>
            <mirrorOf>central</mirrorOf>
          </mirror>
        </mirrors>
      </settings>
      EOF
      
      # 构建
      cd backend
      mvn clean package -DskipTests
      
      # 简单确认构建成功
      echo "构建完成，JAR文件:"
      ls -lh target/
    # 这里不要再有 echo 等命令，已经结束了
  artifacts:
    paths:
      - backend/target/*.jar
  only:
    - feature/initial-commit
  tags:
    - docker

# 阶段2：部署
deploy:
  stage: deploy
  image: docker:24.0.7
  before_script:
    - echo "Docker环境检查"
  script:
    - |
      # 1. 确认有JAR文件
      JAR_FILES=(backend/target/*.jar)
      if [ ${#JAR_FILES[@]} -eq 0 ]; then
        echo "没有找到JAR文件"
        exit 1
      fi
      
      # 2. 创建Dockerfile
      cat > Dockerfile << 'EOF'
      FROM eclipse-temurin:17-jre
      WORKDIR /app
      COPY backend/target/*.jar app.jar
      EXPOSE 8080
      ENTRYPOINT ["java", "-jar", "app.jar"]
      EOF
      
      # 3. 构建镜像
      docker build -t article-backend:latest .
      
      # 4. 确保网络
      if ! docker network ls | grep -q article-fds_article-net; then
        docker network create article-fds_article-net
        docker network connect article-fds_article-net article-mysql
        docker network connect article-fds_article-net article-redis
      fi
      
      # 5. 停止旧容器
      docker stop article-backend 2>/dev/null || true
      docker rm article-backend 2>/dev/null || true
      
      # 6. 启动新容器
      docker run -d \
        --name article-backend \
        --restart unless-stopped \
        -p 8081:8080 \
        --network article-fds_article-net \
        -e SPRING_PROFILES_ACTIVE=prod \
        -e SPRING_DATASOURCE_URL='jdbc:mysql://article-mysql:3306/article_db?useSSL=false' \
        -e SPRING_DATASOURCE_USERNAME=root \
        -e SPRING_DATASOURCE_PASSWORD=fds00913 \
        -e SPRING_REDIS_HOST='article-redis' \
        -e SPRING_REDIS_PORT=6379 \
        article-backend:latest
      
      # 7. 检查启动
      echo "等待应用启动..."
      sleep 15
      if docker ps | grep -q "article-backend.*Up"; then
        echo "部署成功！"
        echo "应用可访问: http://49.233.185.174:8081/api/articles"
        echo "健康检查: http://49.233.185.174:8081/actuator/health"
      else
        echo "容器可能启动中，查看日志:"
        docker logs article-backend 2>/dev/null | tail -5
      fi
  needs: ["build"]
  only:
    - feature/initial-commit
  tags:
    - docker
