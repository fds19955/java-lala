stages:
  - test-aliyun
  - build-backend
  - build-frontend
  - push-images
  - deploy-db
  - deploy

variables:
  DOCKER_HOST: "unix:///var/run/docker.sock"
  DOCKER_TLS_CERTDIR: ""
  MYSQL_ROOT_PASSWORD: $DB_ROOT_PASSWORD
  MYSQL_DATABASE: "article_db"
  DOCKER_REGISTRY: "crpi-qaxlisuwj9fp5gv9.cn-beijing.personal.cr.aliyuncs.com"
  DOCKER_NAMESPACE: "fds-article"
  ALIYUN_REGISTRY_USER: "nick1191472774"
  ALIYUN_REGISTRY_PASSWORD: $ALIYUN_REGISTRY_PASSWORD
  KUBECONFIG: $KUBECONFIG_BASE64




# ========== 阶段0：阿里云测试 ==========
test-aliyun:
  stage: test-aliyun
  image: docker:24.0.7  # 添加这一行
  script:
    - |
      # 添加调试信息
      echo "🔍 调试信息:"
      echo "用户名: $ALIYUN_REGISTRY_USER"
      echo "仓库: $DOCKER_REGISTRY"
      echo "命名空间: $DOCKER_NAMESPACE"
      echo "密码长度: ${#ALIYUN_REGISTRY_PASSWORD} 字符"
      
      # 测试echo到docker login
      echo "测试密码传递..."
      echo "密码前4位: ${ALIYUN_REGISTRY_PASSWORD:0:4}****"
      
      # 直接测试登录
      echo "$ALIYUN_REGISTRY_PASSWORD" | docker login -u "$ALIYUN_REGISTRY_USER" --password-stdin "$DOCKER_REGISTRY"

# ========== 阶段1：构建后端 ==========
build-backend:
  stage: build-backend
  image: maven:3.9.8-eclipse-temurin-17
  script:
    - |
      echo "🚀 开始构建后端应用..."
      
      # 创建Maven阿里云镜像配置
      mkdir -p ~/.m2
      cat > ~/.m2/settings.xml << 'EOF'
      <?xml version="1.0" encoding="UTF-8"?>
      <settings>
        <mirrors>
          <mirror>
            <id>alimaven</id>
            <name>aliyun maven</name>
            <url>https://maven.aliyun.com/repository/public</url>
            <mirrorOf>central</mirrorOf>
          </mirror>
        </mirrors>
      </settings>
      EOF
      
      echo "📦 进入backend目录编译..."
      cd backend
      mvn clean package -DskipTests
      
      echo "✅ 后端构建完成"
      echo "构建产物:"
      ls -lh target/*.jar
  artifacts:
    paths:
      - backend/target/*.jar
    expire_in: 1 hour
  only:
    - feature/initial-commit
    - main
    - develop
  tags:
    - docker

# ========== 阶段2：构建前端 ==========
build-frontend:
  stage: build-frontend
  image: node:20-alpine
  script:
    - |
      echo "🎨 开始构建前端应用..."
      
      if [ ! -d "frontend" ]; then
        echo "⚠️ 前端目录不存在，跳过构建"
        exit 0
      fi
      
      cd frontend
      
      # 设置npm镜像源
      npm config set registry https://registry.npmmirror.com
      
      echo "📦 安装依赖..."
      npm install --silent
      
      echo "🔨 执行构建..."
      npm run build
      
      echo "✅ 前端构建完成"
      echo "构建产物:"
      ls -lh dist/
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour
  only:
    - feature/initial-commit
    - main
    - develop
  tags:
    - docker

# ========== 阶段3：推送镜像到阿里云仓库 ==========
push-images:
  stage: push-images
  image: docker:24.0.7
  needs:
    - build-backend
    - build-frontend
  before_script:
    - apk add --no-cache curl
    - docker --version
  script:
    - |
      set -e # 遇到错误立即退出，避免累积错误
      echo "🚀 开始镜像推送流程..."

      # 1. 登录阿里云镜像仓库 (简化判断)
      echo "🔐 登录阿里云镜像仓库..."
      if [ -z "$ALIYUN_REGISTRY_PASSWORD" ]; then
        echo "❌ 错误：环境变量 ALIYUN_REGISTRY_PASSWORD 未设置或为空"
        exit 1
      fi
      echo "$ALIYUN_REGISTRY_PASSWORD" | docker login -u "$ALIYUN_REGISTRY_USER" --password-stdin "$DOCKER_REGISTRY"
      echo "✅ 阿里云仓库登录成功"

      # 2. 构建并推送后端镜像 (使用 echo 逐行创建 Dockerfile，避免 HEREDOC)
      echo "📦 构建后端镜像..."
      echo "FROM eclipse-temurin:17-jre-alpine" > Dockerfile.backend
      echo "WORKDIR /app" >> Dockerfile.backend
      echo "COPY backend/target/*.jar app.jar" >> Dockerfile.backend
      echo "EXPOSE 8080" >> Dockerfile.backend
      echo 'ENTRYPOINT ["java", "-jar", "app.jar"]' >> Dockerfile.backend

      BACKEND_IMAGE_TAG="${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/article-backend:${CI_COMMIT_SHORT_SHA}"
      LATEST_TAG="${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/article-backend:latest"

      docker build -f Dockerfile.backend -t "$BACKEND_IMAGE_TAG" .
      docker tag "$BACKEND_IMAGE_TAG" "$LATEST_TAG"
      echo "✅ 后端镜像构建完成"

      echo "📤 推送后端镜像..."
      docker push "$BACKEND_IMAGE_TAG"
      docker push "$LATEST_TAG"
      echo "✅ 后端镜像推送完成: $BACKEND_IMAGE_TAG"

      # 3. 构建并推送前端镜像（如果存在）- 修复 if 语句结构
      if [ -d "frontend/dist" ] && [ -n "$(ls -A frontend/dist 2>/dev/null)" ]; then
        echo "📦 构建前端镜像..."
        echo "FROM nginx:alpine" > frontend/Dockerfile.frontend
        echo "COPY dist/ /usr/share/nginx/html" >> frontend/Dockerfile.frontend
        echo "COPY nginx.conf /etc/nginx/conf.d/default.conf" >> frontend/Dockerfile.frontend # 这行没加，找bug找好久
        echo "EXPOSE 80" >> frontend/Dockerfile.frontend

        FRONTEND_IMAGE_TAG="${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/article-frontend:${CI_COMMIT_SHORT_SHA}"
        FRONTEND_LATEST="${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/article-frontend:latest"

        docker build -f frontend/Dockerfile.frontend -t "$FRONTEND_IMAGE_TAG" frontend/
        docker tag "$FRONTEND_IMAGE_TAG" "$FRONTEND_LATEST"
        echo "✅ 前端镜像构建完成"

        echo "📤 推送前端镜像..."
        docker push "$FRONTEND_IMAGE_TAG"
        docker push "$FRONTEND_LATEST"
        echo "✅ 前端镜像推送完成"
        FRONTEND_DEPLOY_INFO="前端: ${FRONTEND_IMAGE_TAG}"
      else
        echo "ℹ️ 前端构建产物不存在，跳过前端镜像构建"
        FRONTEND_DEPLOY_INFO="前端: 未构建"
      fi

      # 4. 验证推送
      echo "🔍 验证镜像推送..."
      if docker pull "$BACKEND_IMAGE_TAG"; then
        echo "✅ 后端镜像验证成功"
      else
        echo "❌ 后端镜像验证失败"
        exit 1
      fi

      # 5. 生成报告
      echo ""
      echo "========== 镜像推送报告 =========="
      echo "✅ 推送成功的镜像:"
      docker images | grep "$DOCKER_REGISTRY/$DOCKER_NAMESPACE" || echo "无相关镜像"
      echo ""
      echo "🔗 镜像地址:"
      echo "后端: $BACKEND_IMAGE_TAG"
      echo "$FRONTEND_DEPLOY_INFO"
      echo "✅ 镜像推送阶段完成"
      
  only:
    - feature/initial-commit
    - main
    - develop
  tags:
    - docker
    
# ========== 阶段4：部署数据库（修复镜像下载问题） ==========
deploy-db:
  stage: deploy-db
  # 使用稳定的 Alpine 镜像 + 手动安装 kubectl
  image: alpine:3.18
  needs: ["test-aliyun"]
  before_script:
    - |
      echo "📦 安装必要工具..."
      apk update
      apk add --no-cache curl mysql-client file
      
      # 安装 kubectl（修复下载问题）
      echo "⬇️ 下载 kubectl..."
      KUBECTL_VERSION="v1.29.0"
      
      # 尝试多个镜像源，不使用 -L 参数避免重定向
      for MIRROR in \
        "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" \
        "https://github.com/kubernetes/kubernetes/releases/download/${KUBECTL_VERSION}/kubernetes-client-linux-amd64.tar.gz" \
        "https://storage.googleapis.com/kubernetes-release/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"; do
        echo "尝试从: $MIRROR 下载"
        
        # 下载到临时文件，不跟随重定向
        if curl -f --connect-timeout 30 --retry 3 -o /tmp/kubectl_download "$MIRROR"; then
          # 检查文件类型和大小
          FILE_SIZE=$(stat -c%s /tmp/kubectl_download 2>/dev/null || wc -c < /tmp/kubectl_download)
          echo "下载文件大小: ${FILE_SIZE} 字节"
          
          # 检查是否是二进制文件（不是HTML/文本）
          if file /tmp/kubectl_download | grep -q "ELF"; then
            echo "✅ 下载的是有效的二进制文件"
            mv /tmp/kubectl_download /usr/local/bin/kubectl
            chmod +x /usr/local/bin/kubectl
            break
          elif [ "$FILE_SIZE" -gt 10000000 ]; then  # 如果文件大于10MB，可能是tar包
            echo "🔍 检测到可能是tar包，尝试解压..."
            tar -xzOf /tmp/kubectl_download kubernetes/client/bin/kubectl 2>/dev/null > /usr/local/bin/kubectl || \
            tar -xzOf /tmp/kubectl_download 2>/dev/null | grep -a "kubectl" > /usr/local/bin/kubectl || \
            cp /tmp/kubectl_download /usr/local/bin/kubectl
            chmod +x /usr/local/bin/kubectl
            break
          else
            echo "❌ 下载的文件不是有效的二进制文件，可能是错误页面"
            file /tmp/kubectl_download
            cat /tmp/kubectl_download | head -5
            continue
          fi
        else
          echo "❌ 下载失败，尝试下一个镜像源"
        fi
      done
      
      # 验证安装
      if [ -x "/usr/local/bin/kubectl" ]; then
        echo "✅ kubectl 安装成功"
        kubectl version --client
      else
        echo "❌ 所有镜像源下载失败，尝试备用方案..."
        
        # 备用方案：从Docker镜像中提取kubectl
        echo "🐳 尝试从k8s镜像中提取kubectl..."
        docker run --rm -v /usr/local/bin:/out bitnami/kubectl:1.29.0 cp /opt/bitnami/kubectl/bin/kubectl /out/kubectl
        chmod +x /usr/local/bin/kubectl
        kubectl version --client
      fi
  script:
    - |
      echo "🔧 开始部署数据库..."
      mkdir -p ~/.kube
      
      # 调试：检查 KUBECONFIG 变量
      echo "🔍 检查 KUBECONFIG 变量..."
      echo "KUBECONFIG 长度: ${#KUBECONFIG} 字符"
      echo "KUBECONFIG 前100字符: ${KUBECONFIG:0:100}"
      
      # 检查变量内容是否是 base64 编码
      if echo "$KUBECONFIG" | grep -q "^[A-Za-z0-9+/]*=*$" && [ $(( ${#KUBECONFIG} % 4 )) -eq 0 ]; then
        echo "📥 检测到 base64 编码，进行解码..."
        echo "$KUBECONFIG" | base64 -d > ~/.kube/config
      else
        echo "📄 检测到已经是普通文本，直接写入..."
        echo "$KUBECONFIG" > ~/.kube/config
      fi
      
      # 验证配置文件
      echo "✅ 验证 kubeconfig 文件..."
      cat ~/.kube/config | head -5
      
      # 检查集群连接
      echo "🔍 检查集群状态..."
      kubectl cluster-info
      kubectl get nodes -o wide
      kubectl get pods -A
      
      # 应用命名空间和Secret
      echo "📁 创建命名空间和Secret..."
      kubectl apply -f k8s/namespace.yaml
      kubectl apply -f k8s/secrets/
      
      # 部署MySQL
      echo "🚀 部署MySQL..."
      kubectl apply -f k8s/mysql/
      
      # 等待MySQL启动
      echo "⏳ 等待MySQL启动..."
      COUNTER=0
      MAX_ATTEMPTS=30
      
      while [ $COUNTER -lt $MAX_ATTEMPTS ]; do
        if kubectl get pods -n article-system -l app=mysql-master 2>/dev/null | grep -q "Running"; then
          echo "✅ MySQL Pod正在运行"
          break
        fi
        echo "等待MySQL启动... ($((COUNTER + 1))/$MAX_ATTEMPTS)"
        sleep 10
        COUNTER=$((COUNTER + 1))
      done
      
      if [ $COUNTER -eq $MAX_ATTEMPTS ]; then
        echo "❌ MySQL启动超时"
        echo "🔍 检查Pod状态:"
        kubectl describe pod -l app=mysql-master -n article-system || true
        exit 1
      fi
      
      # 等待MySQL完全就绪
      echo "⏳ 等待MySQL服务就绪..."
      kubectl wait --for=condition=ready pod -l app=mysql-master -n article-system --timeout=300s
      
      echo "✅ 数据库部署完成"
  when: manual
  only:
    - feature/initial-commit
    - main
    - develop
  tags:
    - docker

# ========== 阶段5：部署应用（修复镜像下载问题） ==========
deploy:
  stage: deploy
  # 使用稳定的 Alpine 镜像 + 手动安装 kubectl
  image: alpine:3.18
  needs: ["test-aliyun"]
  before_script:
    - |
      echo "📦 安装必要工具..."
      apk update
      apk add --no-cache curl mysql-client file
      
      # 安装 kubectl（修复下载问题）
      echo "⬇️ 下载 kubectl..."
      KUBECTL_VERSION="v1.29.0"
      
      # 尝试多个镜像源，不使用 -L 参数避免重定向
      for MIRROR in \
        "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" \
        "https://github.com/kubernetes/kubernetes/releases/download/${KUBECTL_VERSION}/kubernetes-client-linux-amd64.tar.gz" \
        "https://storage.googleapis.com/kubernetes-release/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"; do
        echo "尝试从: $MIRROR 下载"
        
        # 下载到临时文件，不跟随重定向
        if curl -f --connect-timeout 30 --retry 3 -o /tmp/kubectl_download "$MIRROR"; then
          # 检查文件类型和大小
          FILE_SIZE=$(stat -c%s /tmp/kubectl_download 2>/dev/null || wc -c < /tmp/kubectl_download)
          echo "下载文件大小: ${FILE_SIZE} 字节"
          
          # 检查是否是二进制文件（不是HTML/文本）
          if file /tmp/kubectl_download | grep -q "ELF"; then
            echo "✅ 下载的是有效的二进制文件"
            mv /tmp/kubectl_download /usr/local/bin/kubectl
            chmod +x /usr/local/bin/kubectl
            break
          elif [ "$FILE_SIZE" -gt 10000000 ]; then  # 如果文件大于10MB，可能是tar包
            echo "🔍 检测到可能是tar包，尝试解压..."
            tar -xzOf /tmp/kubectl_download kubernetes/client/bin/kubectl 2>/dev/null > /usr/local/bin/kubectl || \
            tar -xzOf /tmp/kubectl_download 2>/dev/null | grep -a "kubectl" > /usr/local/bin/kubectl || \
            cp /tmp/kubectl_download /usr/local/bin/kubectl
            chmod +x /usr/local/bin/kubectl
            break
          else
            echo "❌ 下载的文件不是有效的二进制文件，可能是错误页面"
            file /tmp/kubectl_download
            cat /tmp/kubectl_download | head -5
            continue
          fi
        else
          echo "❌ 下载失败，尝试下一个镜像源"
        fi
      done
      
      # 验证安装
      if [ -x "/usr/local/bin/kubectl" ]; then
        echo "✅ kubectl 安装成功"
        kubectl version --client
      else
        echo "❌ 所有镜像源下载失败，尝试备用方案..."
        
        # 备用方案：从Docker镜像中提取kubectl
        echo "🐳 尝试从k8s镜像中提取kubectl..."
        docker run --rm -v /usr/local/bin:/out bitnami/kubectl:1.29.0 cp /opt/bitnami/kubectl/bin/kubectl /out/kubectl
        chmod +x /usr/local/bin/kubectl
        kubectl version --client
      fi
  script:
    - |
      set -e
      echo "🚀 开始部署应用..."
      echo "🔧 调试 KUBECONFIG 变量..."
      echo "KUBECONFIG 长度: ${#KUBECONFIG}"
      echo "KUB
      mkdir -p ~/.kube

      echo "$KUBECONFIG" | base64 -d > ~/.kube/config
      
      # 检查数据库状态
      echo "🔍 检查数据库状态..."
      kubectl get pods -n article-system -l app=mysql-master
      
      # 更新镜像标签
      echo "🔄 更新应用镜像..."
      kubectl set image deployment/article-backend article-backend=$DOCKER_REGISTRY/$DOCKER_NAMESPACE/article-backend:${CI_COMMIT_SHORT_SHA} -n article-system --record
      
      # 如果前端部署存在，也更新前端
      if kubectl get deployment/article-frontend -n article-system &>/dev/null; then
        kubectl set image deployment/article-frontend article-frontend=$DOCKER_REGISTRY/$DOCKER_NAMESPACE/article-frontend:${CI_COMMIT_SHORT_SHA} -n article-system --record
      fi
      
      # 应用部署配置
      echo "📁 应用Kubernetes配置..."
      kubectl apply -f k8s/backend/
      if [ -d "k8s/frontend" ]; then
        kubectl apply -f k8s/frontend/
      fi
      
      # 等待部署完成
      echo "⏳ 等待后端部署完成..."
      kubectl rollout status deployment/article-backend -n article-system --timeout=300s
      
      if kubectl get deployment/article-frontend -n article-system &>/dev/null; then
        echo "⏳ 等待前端部署完成..."
        kubectl rollout status deployment/article-frontend -n article-system --timeout=300s
      fi
      
      echo "✅ 应用部署完成"
      echo "📊 部署状态:"
      kubectl get deployments,services,pods -n article-system
  only:
    - feature/initial-commit
    - main
    - develop
  tags:
    - docker
