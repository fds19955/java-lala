stages:
  - build-backend
  - build-frontend
  - deploy-db
  - deploy

# ========== 全局配置 ==========
variables:
  DOCKER_HOST: "unix:///var/run/docker.sock"
  DOCKER_TLS_CERTDIR: ""
  MYSQL_ROOT_PASSWORD: $DB_ROOT_PASSWORD  # GitLab CI变量
  MYSQL_DATABASE: "article_db"
  DOCKER_NETWORK: "article-fds-net"
  MYSQL_CONTAINER: "article-mysql"
  REDIS_CONTAINER: "article-redis"
  BACKEND_PORT: "8081"
  FRONTEND_PORT: "80"

# ========== 阶段1：构建后端 ==========
build-backend:
  stage: build-backend
  image: maven:3.9.8-eclipse-temurin-17
  script:
    - |
      echo "🚀 开始构建后端应用..."
      
      # 创建Maven阿里云镜像配置
      mkdir -p ~/.m2
      cat > ~/.m2/settings.xml << 'EOF'
      <?xml version="1.0" encoding="UTF-8"?>
      <settings>
        <mirrors>
          <mirror>
            <id>alimaven</id>
            <name>aliyun maven</name>
            <url>https://maven.aliyun.com/repository/public</url>
            <mirrorOf>central</mirrorOf>
          </mirror>
        </mirrors>
      </settings>
      EOF
      
      echo "📦 进入backend目录编译..."
      cd backend
      mvn clean package -DskipTests
      
      echo "✅ 后端构建完成"
      echo "构建产物:"
      ls -lh target/*.jar
  artifacts:
    paths:
      - backend/target/*.jar
    expire_in: 1 hour
  only:
    - feature/initial-commit
    - main
    - develop
  tags:
    - docker

# ========== 阶段2：构建前端 ==========
build-frontend:
  stage: build-frontend
  image: node:20-alpine
  script:
    - |
      echo "🎨 开始构建前端应用..."
      
      # 检查前端目录是否存在
      if [ ! -d "frontend" ]; then
        echo "⚠️ 前端目录不存在，跳过构建"
        exit 0
      fi
      
      cd frontend
      
      # 设置npm镜像源
      npm config set registry https://registry.npmmirror.com
      
      echo "📦 安装依赖..."
      npm install --silent
      
      echo "🔨 执行构建..."
      npm run build
      
      echo "✅ 前端构建完成"
      echo "构建产物:"
      ls -lh dist/
      echo "index.html文件大小: $(wc -l < dist/index.html) 行"
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour
  only:
    - feature/initial-commit
    - main
    - develop
  tags:
    - docker

# ========== 阶段3：部署数据库（包含SQL导入） ==========
deploy-db:
  stage: deploy-db
  image: docker:24.0.7
  before_script:
    - apk add --no-cache bash coreutils curl
  script:
    - |
      # 切换到bash执行
      exec bash << 'BASH_SCRIPT'
      set -euo pipefail
      
      echo "========== 数据库服务部署 =========="
      
      # 1. 创建专用网络
      echo "🔧 创建Docker网络..."
      if ! docker network ls --format "{{.Name}}" | grep -q "^${DOCKER_NETWORK}$"; then
        docker network create "${DOCKER_NETWORK}"
        echo "✅ 网络创建: ${DOCKER_NETWORK}"
      else
        echo "✅ 网络已存在: ${DOCKER_NETWORK}"
      fi
      
      # 2. 部署MySQL容器
      echo "🐬 部署MySQL..."
      if docker ps --format "{{.Names}}" | grep -q "^${MYSQL_CONTAINER}$"; then
        echo "✅ MySQL容器已在运行"
      elif docker ps -a --format "{{.Names}}" | grep -q "^${MYSQL_CONTAINER}$"; then
        echo "🔄 重启已存在的MySQL容器"
        docker start "${MYSQL_CONTAINER}"
      else
        echo "🚀 创建新的MySQL容器"
        docker run -d \
          --name "${MYSQL_CONTAINER}" \
          --restart unless-stopped \
          --network "${DOCKER_NETWORK}" \
          -p 3306:3306 \
          -e MYSQL_ROOT_PASSWORD="${MYSQL_ROOT_PASSWORD}" \
          -e MYSQL_DATABASE="${MYSQL_DATABASE}" \
          -v mysql-data:/var/lib/mysql \
          mysql:8.0 \
          --default-authentication-plugin=mysql_native_password \
          --character-set-server=utf8mb4 \
          --collation-server=utf8mb4_unicode_ci
      fi
      
      # 3. 等待MySQL启动完成
      echo "⏳ 等待MySQL启动（最多60秒）..."
      for i in $(seq 1 30); do
        if docker exec "${MYSQL_CONTAINER}" mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" -e "SELECT 1" >/dev/null 2>&1; then
          echo "✅ MySQL已就绪 (${i}秒)"
          break
        fi
        if [ $i -eq 30 ]; then
          echo "❌ MySQL启动超时"
          docker logs "${MYSQL_CONTAINER}" --tail 20
          exit 1
        fi
        echo "等待中... (${i}/30)"
        sleep 2
      done
      
      # 4. 数据库初始化 - 关键修复部分！
      echo "📁 检查并导入SQL文件..."
      SQL_FILE="mysql/init/article_db.sql"
      
      if [ -f "${SQL_FILE}" ]; then
        echo "✅ 找到SQL文件: ${SQL_FILE}"
        echo "文件信息:"
        wc -l "${SQL_FILE}"
        echo "前5行内容:"
        head -5 "${SQL_FILE}"
        
        # 确保数据库存在
        echo "确保数据库存在..."
        docker exec "${MYSQL_CONTAINER}" mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" \
          -e "CREATE DATABASE IF NOT EXISTS ${MYSQL_DATABASE} CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
        
        # 导入SQL文件
        echo "正在导入SQL文件（可能需要几秒钟）..."
        docker exec -i "${MYSQL_CONTAINER}" mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" \
          "${MYSQL_DATABASE}" < "${SQL_FILE}"
        
        if [ $? -eq 0 ]; then
          echo "✅ SQL文件导入成功"
        else
          echo "❌ SQL文件导入失败"
          echo "请检查SQL文件语法"
          exit 1
        fi
      else
        echo "⚠️ 警告：未找到SQL文件: ${SQL_FILE}"
        echo "将创建空数据库，后端可能需要自动建表或手动初始化"
        docker exec "${MYSQL_CONTAINER}" mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" \
          -e "CREATE DATABASE IF NOT EXISTS ${MYSQL_DATABASE} CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
      fi
      
      # 5. 验证数据库状态
      echo "🔍 验证数据库状态..."
      docker exec "${MYSQL_CONTAINER}" mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" \
        "${MYSQL_DATABASE}" -e "
        -- 显示所有表
        SHOW TABLES;
        
        -- 表统计
        SELECT 
          '表统计' as '项目',
          COUNT(*) as '数量'
        FROM information_schema.tables 
        WHERE table_schema = '${MYSQL_DATABASE}';
        
        -- 如果有用户表，显示用户数量
        SELECT 
          '用户表' as '表名',
          COUNT(*) as '用户数'
        FROM information_schema.tables 
        WHERE table_schema = '${MYSQL_DATABASE}' AND table_name = 'users';
      " 2>/dev/null || {
        echo "数据库查询可能失败，但继续执行"
      }
      
      # 6. 部署Redis
      echo "🟥 部署Redis..."
      if docker ps --format "{{.Names}}" | grep -q "^${REDIS_CONTAINER}$"; then
        echo "✅ Redis容器已在运行"
      elif docker ps -a --format "{{.Names}}" | grep -q "^${REDIS_CONTAINER}$"; then
        echo "🔄 重启已存在的Redis容器"
        docker start "${REDIS_CONTAINER}"
      else
        echo "🚀 创建新的Redis容器"
        docker run -d \
          --name "${REDIS_CONTAINER}" \
          --restart unless-stopped \
          --network "${DOCKER_NETWORK}" \
          -p 6379:6379 \
          -v redis-data:/data \
          redis:alpine \
          redis-server \
          --maxmemory 512mb \
          --maxmemory-policy allkeys-lru \
          --appendonly yes
      fi
      
      # 7. 等待Redis启动
      echo "⏳ 等待Redis启动..."
      for i in $(seq 1 20); do
        if docker exec "${REDIS_CONTAINER}" redis-cli ping | grep -q "PONG"; then
          echo "✅ Redis已就绪 (${i}秒)"
          break
        fi
        if [ $i -eq 20 ]; then
          echo "❌ Redis启动超时"
          docker logs "${REDIS_CONTAINER}" --tail 10
          exit 1
        fi
        echo "等待中... (${i}/20)"
        sleep 1
      done
      
      # 8. 生成部署报告
      echo ""
      echo "========== 数据库部署报告 =========="
      echo "✅ MySQL:"
      echo "   容器: ${MYSQL_CONTAINER}"
      echo "   数据库: ${MYSQL_DATABASE}"
      echo "   端口: 3306"
      echo "   网络: ${DOCKER_NETWORK}"
      
      echo ""
      echo "✅ Redis:"
      echo "   容器: ${REDIS_CONTAINER}"
      echo "   端口: 6379"
      echo "   网络: ${DOCKER_NETWORK}"
      
      echo ""
      echo "🔗 网络连接:"
      docker network inspect "${DOCKER_NETWORK}" --format '{{range .Containers}}{{.Name}} {{end}}' 2>/dev/null || echo "无法获取网络信息"
      
      echo ""
      echo "========== 数据库部署完成 =========="
      BASH_SCRIPT
  only:
    - feature/initial-commit
    - main
    - develop
  tags:
    - docker
# ========== 阶段4：部署前后端应用 ==========
deploy:
  stage: deploy
  image: docker:24.0.7
  needs: 
    - build-backend
    - build-frontend
    - deploy-db
  before_script:
    - apk add --no-cache bash coreutils curl
  script:
    - |
      # 切换到bash执行
      exec bash << 'BASH_SCRIPT'
      set -euo pipefail
      
      echo "========== 应用服务部署 =========="
      
      # 1. 部署前验证
      echo "🔍 部署前验证..."
      
      # 1.1 验证数据库连接
      echo "测试数据库连接..."
      docker run --rm --network "${DOCKER_NETWORK}" \
        mysql:8.0 mysql -h"${MYSQL_CONTAINER}" -uroot -p"${MYSQL_ROOT_PASSWORD}" \
        -e "SELECT '数据库连接测试成功' as message;" "${MYSQL_DATABASE}" 2>/dev/null \
        && echo "✅ 数据库连接正常" \
        || echo "⚠️ 数据库连接测试失败，但继续部署"
      
      # 1.2 验证数据库表数量
      echo "检查数据库表..."
      TABLE_COUNT=$(docker exec "${MYSQL_CONTAINER}" mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" \
        -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = '${MYSQL_DATABASE}';" 2>/dev/null || echo "0")
      
      echo "数据库表数量: ${TABLE_COUNT}"
      if [ "${TABLE_COUNT}" -lt 1 ]; then
        echo "⚠️ 警告：数据库表可能为空，API可能返回空数据"
      fi
      
      # 2. 部署后端服务
      echo ""
      echo "🚀 部署后端服务..."
      
      # 2.1 检查JAR文件
      if ! ls backend/target/*.jar 1>/dev/null 2>&1; then
        echo "❌ 错误：未找到后端JAR文件"
        echo "请确保build-backend阶段成功执行"
        exit 1
      fi
      
      JAR_FILE=$(ls backend/target/*.jar | head -1)
      echo "✅ 找到JAR文件: ${JAR_FILE}"
      echo "文件大小: $(ls -lh "${JAR_FILE}" | awk '{print \$5}')"
      
      # 2.2 构建后端Docker镜像
      echo "📦 构建后端Docker镜像..."
      cat > Dockerfile << 'EOF'
      FROM eclipse-temurin:17-jre-alpine
      WORKDIR /app
      COPY backend/target/*.jar app.jar
      EXPOSE 8080
      ENTRYPOINT ["java", "-jar", "app.jar"]
      EOF
      
      docker build -t article-backend:latest .
      
      # 2.3 停止并移除旧容器
      echo "🧹 清理旧容器..."
      docker stop article-backend 2>/dev/null || true
      docker rm article-backend 2>/dev/null || true
      
      # 2.4 运行后端容器（优化的配置）
      echo "🏃 启动后端容器..."
      docker run -d \
        --name article-backend \
        --restart unless-stopped \
        --network "${DOCKER_NETWORK}" \
        -p ${BACKEND_PORT}:8080 \
        -e SPRING_PROFILES_ACTIVE=prod \
        -e SPRING_DATASOURCE_URL="jdbc:mysql://${MYSQL_CONTAINER}:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&autoReconnect=true" \
        -e SPRING_DATASOURCE_USERNAME=root \
        -e SPRING_DATASOURCE_PASSWORD="${MYSQL_ROOT_PASSWORD}" \
        -e SPRING_DATASOURCE_DRIVER_CLASS_NAME='com.mysql.cj.jdbc.Driver' \
        -e SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT=30000 \
        -e SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=10 \
        -e SPRING_REDIS_HOST="${REDIS_CONTAINER}" \
        -e SPRING_REDIS_PORT=6379 \
        -e SPRING_REDIS_TIMEOUT=5000 \
        -e SERVER_PORT=8080 \
        -e SERVER_TOMCAT_CONNECTION_TIMEOUT=30000 \
        -e JAVA_OPTS='-Xmx512m -Xms256m -Dfile.encoding=UTF-8 -Dspring.datasource.hikari.connection-timeout=30000 -Dlogging.level.com.zaxxer.hikari=DEBUG' \
        article-backend:latest
      
      echo "✅ 后端部署完成"
      echo "容器名: article-backend"
      echo "内部端口: 8080"
      echo "外部端口: ${BACKEND_PORT}"
      
      # 3. 部署前端服务
      echo ""
      echo "🚀 部署前端服务..."
      
      # 3.1 检查前端构建产物
      if [ ! -d "frontend/dist" ] || [ -z "$(ls -A frontend/dist 2>/dev/null)" ]; then
        echo "⚠️ 前端构建产物不存在或为空，跳过前端部署"
        echo "如果前端已手动部署，可以忽略此警告"
      else
        echo "✅ 找到前端构建产物"
        
        # 3.2 创建Nginx配置文件
        cat > frontend/nginx.conf << 'EOF'
        server {
            listen 80;
            server_name localhost;
            root /usr/share/nginx/html;
            
            # Vue Router history模式支持
            location / {
                try_files $uri $uri/ /index.html;
            }
            
            # 静态资源缓存
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
            
            # 代理后端API（可选）
            location /api/ {
                proxy_pass http://article-backend:8080;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }
        }
        EOF
        
        # 3.3 创建前端Dockerfile
        cat > frontend/Dockerfile << 'EOF'
        FROM nginx:alpine
        COPY dist/ /usr/share/nginx/html
        COPY nginx.conf /etc/nginx/conf.d/default.conf
        EXPOSE 80
        CMD ["nginx", "-g", "daemon off;"]
        EOF
        
        # 3.4 构建前端镜像
        echo "📦 构建前端Docker镜像..."
        docker build -t article-frontend:latest frontend/
        
        # 3.5 停止并移除旧容器
        echo "🧹 清理旧前端容器..."
        docker stop article-frontend 2>/dev/null || true
        docker rm article-frontend 2>/dev/null || true
        
        # 3.6 运行前端容器
        echo "🏃 启动前端容器..."
        docker run -d \
          --name article-frontend \
          --restart unless-stopped \
          --network "${DOCKER_NETWORK}" \
          -p ${FRONTEND_PORT}:80 \
          article-frontend:latest
        
        echo "✅ 前端部署完成"
        echo "容器名: article-frontend"
        echo "端口: ${FRONTEND_PORT}"
      fi
      
      # 4. 部署后验证
      echo ""
      echo "🧪 部署后验证..."
      
      # 4.1 等待应用启动
      echo "⏳ 等待后端应用启动（最多30秒）..."
      for i in $(seq 1 15); do
        if docker logs article-backend 2>/dev/null | grep -q "Started.*Application"; then
          echo "✅ 后端应用已完全启动 (${i}秒)"
          break
        fi
        if [ $i -eq 10 ]; then
          echo "⚠️ 应用启动较慢，继续等待..."
        fi
        echo "等待中... (${i}/15)"
        sleep 2
      done
      
      # 4.2 检查容器状态
      echo ""
      echo "📊 容器状态:"
      docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | grep -E "article-|mysql|redis" || echo "未找到相关容器"
      
      # 4.3 检查后端日志
      echo ""
      echo "📝 后端关键日志:"
      docker logs article-backend --tail 20 | grep -E "Started|ERROR|WARN|Hikari" || echo "无关键日志"
      
      # 4.4 API健康检查
      echo ""
      echo "🔍 API健康检查:"
      
      API_SUCCESS=false
      for attempt in $(seq 1 8); do
        echo "尝试 ${attempt}/8..."
        
        # 尝试访问API
        RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${BACKEND_PORT}/api/articles" --max-time 10 2>/dev/null || echo "000")
        
        case "${RESPONSE_CODE}" in
          "200")
            echo "✅ API响应正常 (HTTP 200)"
            API_SUCCESS=true
            break
            ;;
          "401"|"403")
            echo "✅ API响应 (HTTP ${RESPONSE_CODE}) - 可能需要认证"
            API_SUCCESS=true
            break
            ;;
          "404")
            echo "⚠️ API端点不存在 (HTTP 404) - 检查API路径"
            API_SUCCESS=true
            break
            ;;
          "500")
            echo "❌ 服务器内部错误 (HTTP 500) - 查看后端日志"
            docker logs article-backend --tail 30
            break
            ;;
          "000")
            echo "⏳ API无响应，等待重试..."
            sleep 3
            ;;
          *)
            echo "⚠️ 未知响应: HTTP ${RESPONSE_CODE}"
            sleep 2
            ;;
        esac
      done
      
      if [ "${API_SUCCESS}" = true ]; then
        echo "✅ API基本可用"
      else
        echo "⚠️ API检查失败，但部署流程继续完成"
      fi
      
      # 4.5 前端检查（如果部署了）
      if docker ps --format "{{.Names}}" | grep -q "^article-frontend$"; then
        echo ""
        echo "🔍 前端健康检查:"
        FRONTEND_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${FRONTEND_PORT}" --max-time 5 2>/dev/null || echo "000")
        if [ "${FRONTEND_RESPONSE}" = "200" ] || [ "${FRONTEND_RESPONSE}" = "304" ]; then
          echo "✅ 前端服务正常 (HTTP ${FRONTEND_RESPONSE})"
        else
          echo "⚠️ 前端服务响应: HTTP ${FRONTEND_RESPONSE}"
        fi
      fi
      
      # 5. 生成最终报告
      echo ""
      echo "========== 部署完成报告 =========="
      echo "🎉 部署流程完成!"
      echo ""
      echo "📋 服务状态:"
      echo "  后端API: http://49.233.185.174:${BACKEND_PORT}/api/articles"
      echo "  前端界面: http://49.233.185.174"
      echo "  MySQL: localhost:3306 (article_db)"
      echo "  Redis: localhost:6379"
      echo ""
      echo "🔧 容器列表:"
      docker ps --filter "name=article-*" --format "  - {{.Names}} ({{.Status}})"
      echo ""
      echo "📝 故障排除:"
      echo "  1. 查看后端日志: docker logs article-backend"
      echo "  2. 查看前端日志: docker logs article-frontend"
      echo "  3. 检查数据库: docker exec article-mysql mysql -uroot -p'${MYSQL_ROOT_PASSWORD}' article_db -e 'SHOW TABLES;'"
      echo "  4. 重启后端: docker restart article-backend"
      echo ""
      echo "✅ CI/CD流水线执行完成"
      echo "========== 结束 =========="
      BASH_SCRIPT
  only:
    - feature/initial-commit
    - main
    - develop
  tags:
    - docker
