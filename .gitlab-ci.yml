stages:
  - build-backend
  - build-frontend
  - push-images  # 新增：推送镜像阶段
  - deploy-db
  - deploy

# ========== 全局配置 ==========
variables:
  DOCKER_HOST: "unix:///var/run/docker.sock"
  DOCKER_TLS_CERTDIR: ""
  MYSQL_ROOT_PASSWORD: $DB_ROOT_PASSWORD
  MYSQL_DATABASE: "article_db"
  DOCKER_NETWORK: "article-fds-net"
  MYSQL_CONTAINER: "article-mysql"
  REDIS_CONTAINER: "article-redis"
  BACKEND_PORT: "8081"
  FRONTEND_PORT: "80"
  
  # 新增：镜像仓库配置
  DOCKER_REGISTRY: "crpi-qaxlisuwj9fp5gv9.cn-beijing.personal.cr.aliyuncs.com/fds-article/article-backend"  # 替换为您的仓库地址
  DOCKER_NAMESPACE: "fds-article"       # 替换为您的命名空间
  CI_REGISTRY_USER: $CI_REGISTRY_USER      # GitLab CI变量
  CI_REGISTRY_PASSWORD: $CI_REGISTRY_PASSWORD

# ========== 阶段1：构建后端 ==========
build-backend:
  stage: build-backend
  image: maven:3.9.8-eclipse-temurin-17
  script:
    - |
      echo "🚀 开始构建后端应用..."
      
      # 创建Maven阿里云镜像配置
      mkdir -p ~/.m2
      cat > ~/.m2/settings.xml << 'EOF'
      <?xml version="1.0" encoding="UTF-8"?>
      <settings>
        <mirrors>
          <mirror>
            <id>alimaven</id>
            <name>aliyun maven</name>
            <url>https://maven.aliyun.com/repository/public</url>
            <mirrorOf>central</mirrorOf>
          </mirror>
        </mirrors>
      </settings>
      EOF
      
      echo "📦 进入backend目录编译..."
      cd backend
      mvn clean package -DskipTests
      
      echo "✅ 后端构建完成"
      echo "构建产物:"
      ls -lh target/*.jar
  artifacts:
    paths:
      - backend/target/*.jar
    expire_in: 1 hour
  only:
    - feature/initial-commit
    - main
    - develop
  tags:
    - docker

# ========== 阶段2：构建前端 ==========
build-frontend:
  stage: build-frontend
  image: node:20-alpine
  script:
    - |
      echo "🎨 开始构建前端应用..."
      
      if [ ! -d "frontend" ]; then
        echo "⚠️ 前端目录不存在，跳过构建"
        exit 0
      fi
      
      cd frontend
      
      # 设置npm镜像源
      npm config set registry https://registry.npmmirror.com
      
      echo "📦 安装依赖..."
      npm install --silent
      
      echo "🔨 执行构建..."
      npm run build
      
      echo "✅ 前端构建完成"
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour
  only:
    - feature/initial-commit
    - main
    - develop
  tags:
    - docker

# ========== 新增阶段：推送镜像到仓库 ==========
push-images:
  stage: push-images
  image: docker:24.0.7
  needs:
    - build-backend
    - build-frontend
  before_script:
    - apk add --no-cache curl
    - docker --version
  script:
    - |
      echo "🚀 开始镜像推送流程..."
      
      # 1. 登录镜像仓库
      echo "🔐 登录镜像仓库..."
      if [ -n "$CI_REGISTRY_USER" ] && [ -n "$CI_REGISTRY_PASSWORD" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$DOCKER_REGISTRY"
        if [ $? -eq 0 ]; then
          echo "✅ 仓库登录成功"
        else
          echo "❌ 仓库登录失败"
          exit 1
        fi
      else
        echo "⚠️ 使用匿名访问（可能无法推送）"
      fi
      
      # 2. 构建并推送后端镜像
      echo "📦 构建后端镜像..."
      cat > Dockerfile.backend << 'EOF'
      FROM eclipse-temurin:17-jre-alpine
      WORKDIR /app
      COPY backend/target/*.jar app.jar
      EXPOSE 8080
      ENTRYPOINT ["java", "-jar", "app.jar"]
      EOF
      
      # 生成镜像标签（包含commit SHA）
      BACKEND_IMAGE_TAG="${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/article-backend:${CI_COMMIT_SHORT_SHA}"
      LATEST_TAG="${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/article-backend:latest"
      
      docker build -f Dockerfile.backend -t "$BACKEND_IMAGE_TAG" .
      docker tag "$BACKEND_IMAGE_TAG" "$LATEST_TAG"
      
      echo "✅ 后端镜像构建完成"
      echo "镜像标签: $BACKEND_IMAGE_TAG"
      
      # 3. 推送后端镜像
      echo "📤 推送后端镜像..."
      docker push "$BACKEND_IMAGE_TAG"
      docker push "$LATEST_TAG"
      echo "✅ 后端镜像推送完成"
      
      # 4. 构建并推送前端镜像（如果存在）
      if [ -d "frontend/dist" ] && [ -n "$(ls -A frontend/dist 2>/dev/null)" ]; then
        echo "📦 构建前端镜像..."
        
        cat > frontend/Dockerfile.frontend << 'EOF'
        FROM nginx:alpine
        COPY dist/ /usr/share/nginx/html
        COPY nginx.conf /etc/nginx/conf.d/default.conf
        EXPOSE 80
        EOF
        
        # 生成前端镜像标签
        FRONTEND_IMAGE_TAG="${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/article-frontend:${CI_COMMIT_SHORT_SHA}"
        FRONTEND_LATEST="${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/article-frontend:latest"
        
        docker build -f frontend/Dockerfile.frontend -t "$FRONTEND_IMAGE_TAG" frontend/
        docker tag "$FRONTEND_IMAGE_TAG" "$FRONTEND_LATEST"
        
        echo "✅ 前端镜像构建完成"
        
        # 推送前端镜像
        echo "📤 推送前端镜像..."
        docker push "$FRONTEND_IMAGE_TAG"
        docker push "$FRONTEND_LATEST"
        echo "✅ 前端镜像推送完成"
      else
        echo "⚠️ 前端构建产物不存在，跳过前端镜像构建"
      fi
      
      # 5. 生成镜像报告
      echo ""
      echo "========== 镜像推送报告 =========="
      echo "✅ 推送成功的镜像:"
      docker images | grep "$DOCKER_REGISTRY/$DOCKER_NAMESPACE" || echo "无相关镜像"
      
      echo ""
      echo "🔗 镜像地址:"
      echo "后端: $BACKEND_IMAGE_TAG"
      echo "前端: ${FRONTEND_IMAGE_TAG:-未构建}"
      
      echo "✅ 镜像推送阶段完成"
  only:
    - main
    - develop
  tags:
    - docker

# ========== 阶段3：部署数据库 ==========
deploy-db:
  stage: deploy-db
  image: docker:24.0.7
  before_script:
    - apk add --no-cache bash coreutils curl
  script:
    - |
      # 原有数据库部署代码保持不变
      exec bash << 'BASH_SCRIPT'
      set -euo pipefail
      echo "========== 数据库服务部署 =========="
      # ... 原有数据库部署脚本
      BASH_SCRIPT
  only:
    - feature/initial-commit
    - main
    - develop
  tags:
    - docker

# ========== 阶段4：部署应用（修改为从仓库拉取镜像） ==========
deploy:
  stage: deploy
  image: docker:24.0.7
  needs: 
    - push-images  # 依赖镜像推送阶段
    - deploy-db
  before_script:
    - apk add --no-cache bash coreutils curl
  script:
    - |
      exec bash << 'BASH_SCRIPT'
      set -euo pipefail
      
      echo "========== 从仓库拉取镜像并部署 =========="
      
      # 1. 登录镜像仓库（如果需要认证）
      if [ -n "$CI_REGISTRY_USER" ] && [ -n "$CI_REGISTRY_PASSWORD" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$DOCKER_REGISTRY"
      fi
      
      # 2. 拉取后端镜像
      BACKEND_IMAGE="${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/article-backend:${CI_COMMIT_SHORT_SHA}"
      echo "📥 拉取后端镜像: $BACKEND_IMAGE"
      docker pull "$BACKEND_IMAGE"
      docker tag "$BACKEND_IMAGE" article-backend:latest
      
      # 3. 拉取前端镜像（如果存在）
      FRONTEND_IMAGE="${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/article-frontend:${CI_COMMIT_SHORT_SHA}"
      if docker pull "$FRONTEND_IMAGE" 2>/dev/null; then
        echo "📥 拉取前端镜像: $FRONTEND_IMAGE"
        docker tag "$FRONTEND_IMAGE" article-frontend:latest
      else
        echo "⚠️ 前端镜像不存在，跳过前端部署"
      fi
      
      # 4. 原有部署逻辑（使用拉取的镜像）
      echo "🔧 创建Docker网络..."
      if ! docker network ls --format "{{.Name}}" | grep -q "^${DOCKER_NETWORK}$"; then
        docker network create "${DOCKER_NETWORK}"
      fi
      
      # 部署MySQL和Redis（与之前相同）
      # ... 数据库部署代码
      
      # 部署后端（使用从仓库拉取的镜像）
      echo "🚀 部署后端服务..."
      docker stop article-backend 2>/dev/null || true
      docker rm article-backend 2>/dev/null || true
      
      docker run -d \
        --name article-backend \
        --restart unless-stopped \
        --network "${DOCKER_NETWORK}" \
        -p ${BACKEND_PORT}:8080 \
        -e SPRING_PROFILES_ACTIVE=prod \
        -e SPRING_DATASOURCE_URL="jdbc:mysql://${MYSQL_CONTAINER}:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=UTF-8" \
        -e SPRING_DATASOURCE_USERNAME=root \
        -e SPRING_DATASOURCE_PASSWORD="${MYSQL_ROOT_PASSWORD}" \
        article-backend:latest
      
      # 部署前端（如果镜像存在）
      if docker images | grep -q "article-frontend"; then
        echo "🚀 部署前端服务..."
        docker stop article-frontend 2>/dev/null || true
        docker rm article-frontend 2>/dev/null || true
        
        docker run -d \
          --name article-frontend \
          --restart unless-stopped \
          --network "${DOCKER_NETWORK}" \
          -p ${FRONTEND_PORT}:80 \
          article-frontend:latest
      fi
      
      # 健康检查（与之前相同）
      # ... 健康检查代码
      
      echo "✅ 从仓库部署完成"
      BASH_SCRIPT
  only:
    - main
    - develop
  tags:
    - docker
