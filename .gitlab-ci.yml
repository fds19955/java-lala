# 全栈应用CI/CD流水线 - 终极简化版本（使用宿主机Docker）
stages:
  - build
  - deploy

variables:
  # 目标服务器信息
  DEPLOY_SERVER: "49.233.185.174"
  DEPLOY_USER: "ubuntu"
  DEPLOY_PORT: "22"
  # 配置国内镜像源
  MAVEN_MIRROR: "https://maven.aliyun.com/repository/public"  
  NPM_REGISTRY: "https://registry.npmmirror.com/"  

# 直接使用宿主机Docker，不需要Docker-in-Docker服务
# services:
#   - name: docker:20.10.16-dind
#     alias: docker

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - backend/.m2/repository
    - frontend/node_modules/

# 1. 构建前后端Docker镜像并打包到目标服务器
build-and-deploy:
  stage: build
  image: docker:20.10.16
  before_script:
    - apk add --no-cache openssh-client docker-compose
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -p $DEPLOY_PORT $DEPLOY_SERVER >> ~/.ssh/known_hosts
  script:
    # 构建后端Docker镜像
    - cd backend
    - docker build -t backend:$CI_COMMIT_SHORT_SHA .
    - docker save -o backend-image.tar backend:$CI_COMMIT_SHORT_SHA
    
    # 构建前端Docker镜像
    - cd ../frontend
    - docker build -t frontend:$CI_COMMIT_SHORT_SHA .
    - docker save -o frontend-image.tar frontend:$CI_COMMIT_SHORT_SHA
    
    # 将镜像文件复制到目标服务器
    - scp -P $DEPLOY_PORT ../backend/backend-image.tar $DEPLOY_USER@$DEPLOY_SERVER:/home/ubuntu/
    - scp -P $DEPLOY_PORT frontend-image.tar $DEPLOY_USER@$DEPLOY_SERVER:/home/ubuntu/
    
    # 生成生产环境docker-compose文件
    - 'cat > docker-compose.prod.yml << "EOF"'
    - 'version: "3.8"'
    - 'services:'
    - '  mysql-db:'
    - '    image: mysql:8.0'
    - '    container_name: article-mysql'
    - '    restart: unless-stopped'
    - '    environment:'
    - '      MYSQL_ROOT_PASSWORD: fds00913'
    - '      MYSQL_DATABASE: article_db'
    - '      TZ: Asia/Shanghai'
    - '    ports:'
    - '      - "3306:3306"'
    - '    volumes:'
    - '      - /home/ubuntu/mysql/data:/var/lib/mysql'
    - '    networks:'
    - '      - app-network'
    - ''
    - '  redis:'
    - '    image: redis:alpine'
    - '    container_name: article-redis'
    - '    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru'
    - '    ports:'
    - '      - "6379:6379"'
    - '    networks:'
    - '      - app-network'
    - ''
    - '  backend-app:'
    - '    image: backend:$CI_COMMIT_SHORT_SHA'
    - '    container_name: article-backend'
    - '    restart: unless-stopped'
    - '    ports:'
    - '      - "8080:8080"'
    - '    environment:'
    - '      SPRING_PROFILES_ACTIVE: prod'
    - '      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/article_db?useSSL=false&serverTimezone=Asia/Shanghai'
    - '      SPRING_DATASOURCE_USERNAME: root'
    - '      SPRING_DATASOURCE_PASSWORD: fds00913'
    - '    depends_on:'
    - '      - mysql-db'
    - '      - redis'
    - '    networks:'
    - '      - app-network'
    - ''
    - '  frontend-app:'
    - '    image: frontend:$CI_COMMIT_SHORT_SHA'
    - '    container_name: article-frontend'
    - '    restart: unless-stopped'
    - '    ports:'
    - '      - "80:80"'
    - '    depends_on:'
    - '      - backend-app'
    - '    networks:'
    - '      - app-network'
    - ''
    - 'networks:'
    - '  app-network:'
    - '    driver: bridge'
    - 'EOF'
    
    # 将docker-compose文件复制到目标服务器
    - scp -P $DEPLOY_PORT docker-compose.prod.yml $DEPLOY_USER@$DEPLOY_SERVER:/home/ubuntu/
    
    # 在目标服务器上加载镜像并部署应用
    - 'ssh -p $DEPLOY_PORT $DEPLOY_USER@$DEPLOY_SERVER << "EOF"'
    - '# 加载Docker镜像'
    - 'cd /home/ubuntu/'
    - 'docker load -i backend-image.tar'
    - 'docker load -i frontend-image.tar'
    - ''
    - '# 停止旧容器并启动新容器'
    - 'docker-compose -f docker-compose.prod.yml down'
    - 'docker-compose -f docker-compose.prod.yml up -d'
    - ''
    - '# 清理无用镜像和文件'
    - 'docker image prune -f'
    - 'rm -f backend-image.tar frontend-image.tar'
    - ''
    - '# 健康检查'
    - 'sleep 30'
    - 'docker ps'
    - 'echo "部署完成！应用访问地址：http://49.233.185.174"'
    - 'EOF'
  only:
    - feature/initial-commit
  tags:
    - docker
