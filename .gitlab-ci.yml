 
stages:
  - build
  - test
  - deploy

variables:
  DOCKER_BUILDKIT: 1
  COMPOSE_PROJECT_NAME: "article-system"
  COMPOSE_FILE: "docker-compose.yml"

cache:
  paths:
    - backend/target/
    - frontend/node_modules/
    - ~/.m2/repository/

# 1. 构建阶段
build-backend:
  stage: build
  image: maven:3.9.8-eclipse-temurin-17
  script:
    - cd backend
    - mvn clean package -DskipTests -Dmaven.test.skip=true
  artifacts:
    paths:
      - backend/target/*.jar
    expire_in: 1 week
  tags:
    - docker

build-frontend:
  stage: build
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci --only=production --registry=https://registry.npmmirror.com
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week
  tags:
    - docker

# 2. 部署阶段（核心简化）
deploy-production:
  stage: deploy
  image: docker/compose:1.29.2
  variables:
    DOCKER_HOST: "tcp://docker:2375"
  services:
    - docker:dind
  script:
    - |
      echo "🚀 开始企业级部署..."
      
      # 1. 环境检查
      echo "1. 检查环境变量..."
      echo "MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:0:2}******"
      echo "项目名称: ${COMPOSE_PROJECT_NAME}"
      
      # 2. 停止旧服务（优雅）
      echo "2. 停止现有服务..."
      docker-compose down --remove-orphans --timeout 30 || true
      
      # 3. 构建所有镜像
      echo "3. 构建Docker镜像..."
      docker-compose build --pull --no-cache
      
      # 4. 启动所有服务
      echo "4. 启动所有服务（4个容器）..."
      docker-compose up -d --remove-orphans
      
      # 5. 健康检查（企业级）
      echo "5. 执行健康检查..."
      max_retries=30
      for i in $(seq 1 $max_retries); do
        echo "检查进度 ($i/$max_retries)"
        
        # 检查MySQL
        mysql_status=$(docker-compose ps mysql | grep -o "Up" || echo "Down")
        
        # 检查后端
        backend_status=$(docker-compose exec -T backend curl -s http://localhost:8080/actuator/health | grep -o '"status":"UP"' || echo "Down")
        
        # 检查前端
        frontend_status=$(docker-compose exec -T frontend curl -s http://localhost | grep -o "DOCTYPE" || echo "Down")
        
        echo "MySQL: $mysql_status | Backend: $backend_status | Frontend: $frontend_status"
        
        # 所有服务都健康才退出
        if [ "$mysql_status" = "Up" ] && [ "$backend_status" != "Down" ] && [ "$frontend_status" != "Down" ]; then
          echo "✅ 所有服务健康"
          break
        fi
        
        if [ $i -eq $max_retries ]; then
          echo "⚠️ 部分服务启动较慢，继续部署流程"
          docker-compose logs --tail=20
        fi
        
        sleep 5
      done
      
      # 6. 最终验证
      echo "6. 最终验证..."
      echo "服务状态:"
      docker-compose ps --all
      
      echo ""
      echo "运行命令:"
      echo "查看日志: docker-compose logs -f"
      echo "重启服务: docker-compose restart"
      echo "停止服务: docker-compose down"
      
      echo ""
      echo "✅ 企业级部署完成!"
      echo "前端: http://49.233.185.174"
      echo "API: http://49.233.185.174:8081/api/articles"
      echo "MySQL: 49.233.185.174:3306"
      echo "Redis: 49.233.185.174:6379"
  environment:
    name: production
    url: http://49.233.185.174
  only:
    - main
    - master
    - feature/initial-commit
  tags:
    - docker
 
