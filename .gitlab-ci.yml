stages:
  - build-backend
  - build-frontend
  - deploy

variables:
  DOCKER_HOST: "unix:///var/run/docker.sock"
  DOCKER_TLS_CERTDIR: ""

# 阶段1：构建后端（不变，已成功）
build-backend:
  stage: build-backend
  image: maven:3.9.8-eclipse-temurin-17
  script:
    - |
      mkdir -p ~/.m2
      cat > ~/.m2/settings.xml << 'EOF'
      <?xml version="1.0" encoding="UTF-8"?>
      <settings>
        <mirrors>
          <mirror>
            <id>alimaven</id>
            <name>aliyun maven</name>
            <url>https://maven.aliyun.com/repository/public</url> 
            <mirrorOf>central</mirrorOf>
          </mirror>
        </mirrors>
      </settings>
      EOF
      
      cd backend
      mvn clean package -DskipTests
      ls -lh target/
  artifacts:
    paths:
      - backend/target/*.jar
  only:
    - feature/initial-commit
  tags:
    - docker

# 阶段2：新增前端构建
build-frontend:
  stage: build-frontend
  image: node:20-alpine
  script:
    - echo "📦 开始构建前端..."
    - cd frontend
    - npm install --registry=https://registry.npmmirror.com 
    - npm run build
    - ls -lh dist/
  artifacts:
    paths:
      - frontend/dist/
  only:
    - feature/initial-commit
  tags:
    - docker

# 阶段3：部署（修改为同时部署后端和前端）
deploy:
  stage: deploy
  image: docker:24.0.7
  before_script:
    - echo "Docker环境检查"
  script:
    - |
      echo "========== 开始部署 =========="
      
      # 1. 部署后端（不变，已成功）
      echo "🚀 部署后端服务..."
      
      # 确认有JAR文件
      echo "查找JAR文件..."
      if ls backend/target/*.jar 1>/dev/null 2>&1; then
        JAR_FILE=$(ls backend/target/*.jar | head -1)
        echo "✅ 找到JAR文件: $JAR_FILE"
      else
        echo "❌ 错误：没有找到JAR文件"
        exit 1
      fi
      
      # 创建后端Dockerfile
      cat > backend/Dockerfile << 'EOF'
      FROM eclipse-temurin:17-jre
      WORKDIR /app
      COPY target/*.jar app.jar
      EXPOSE 8080
      ENTRYPOINT ["java", "-jar", "app.jar"]
      EOF
      
      # 构建后端镜像
      echo "📦 构建后端Docker镜像..."
      docker build -t article-backend:latest backend/
      
      # 确保网络
      echo "🌐 检查网络连接..."
      if ! docker network ls | grep -q article-fds_article-net; then
        echo "创建网络并连接数据库..."
        docker network create article-fds_article-net
        docker network connect article-fds_article-net article-mysql
        docker network connect article-fds_article-net article-redis
      else
        echo "网络已存在，确保数据库已连接..."
        if ! docker network inspect article-fds_article-net | grep -q article-mysql; then
          docker network connect article-fds_article-net article-mysql
        fi
        if ! docker network inspect article-fds_article-net | grep -q article-redis; then
          docker network connect article-fds_article-net article-redis
        fi
      fi
      
      # 停止旧后端容器
      echo "🧹 停止旧版本后端..."
      docker stop article-backend 2>/dev/null || true
      docker rm article-backend 2>/dev/null || true
      
      # 数据库初始化（不变，已成功）
      echo "📁 执行数据库初始化..."
      docker exec article-mysql mysql -uroot -pfds00913 -e "DROP DATABASE IF EXISTS article_db; CREATE DATABASE article_db;"
      cat mysql/init/article_db.sql | docker exec -i article-mysql mysql -uroot -pfds00913 article_db
      echo "✅ 数据库初始化完成"
      sleep 2

      # 启动新后端容器
      echo "🚢 启动新后端服务..."
      docker run -d \
        --name article-backend \
        --restart unless-stopped \
        -p 8081:8080 \
        --network article-fds_article-net \
        -e SPRING_PROFILES_ACTIVE=prod \
        -e SPRING_DATASOURCE_URL='jdbc:mysql://article-mysql:3306/article_db?useSSL=false&serverTimezone=Asia/Shanghai' \
        -e SPRING_DATASOURCE_USERNAME=root \
        -e SPRING_DATASOURCE_PASSWORD=fds00913 \
        -e SPRING_REDIS_HOST='article-redis' \
        -e SPRING_REDIS_PORT=6379 \
        -e SERVER_PORT=8080 \
        -e LOGGING_LEVEL_ROOT=info \
        -e JAVA_OPTS='-Xmx512m -Xms256m' \
        article-backend:latest
      
      # 2. 部署前端
      echo "🚀 部署前端服务..."
      
      # 构建前端镜像
      echo "📦 构建前端Docker镜像..."
      docker build -t article-frontend:latest frontend/
      
      # 停止旧前端容器
      echo "🧹 停止旧版本前端..."
      docker stop article-frontend 2>/dev/null || true
      docker rm article-frontend 2>/dev/null || true
      
      # 启动新前端容器
      echo "🚢 启动新前端服务..."
      docker run -d \
        --name article-frontend \
        --restart unless-stopped \
        -p 80:80 \
        --network article-fds_article-net \
        article-frontend:latest
      
      # 3. 健康检查（修改为同时检查后端和前端）
      echo ""
      echo "========== 健康检查开始 =========="
      
      # 检查后端容器状态
      echo "🔍 检查后端容器状态..."
      CONTAINER_STARTED=false
      i=1
      while [ $i -le 20 ]; do
        if docker ps --format "table {{{{.Names}}}}\t{{{{.Status}}}}" | grep -q "article-backend.*Up"; then
          CONTAINER_STARTED=true
          echo "✅ 后端容器已启动（$i秒）"
          break
        fi
        echo "等待后端容器启动...($i/20)"
        sleep 2
        i=$((i + 1))
      done
      
      # 检查前端容器状态
      echo "🔍 检查前端容器状态..."
      FRONTEND_STARTED=false
      i=1
      while [ $i -le 20 ]; do
        if docker ps --format "table {{{{.Names}}}}\t{{{{.Status}}}}" | grep -q "article-frontend.*Up"; then
          FRONTEND_STARTED=true
          echo "✅ 前端容器已启动（$i秒）"
          break
        fi
        echo "等待前端容器启动...($i/20)"
        sleep 2
        i=$((i + 1))
      done
      
      # 后端应用启动检查
      echo ""
      echo "🔍 检查后端应用启动..."
      i=1
      while [ $i -le 15 ]; do
        if docker logs article-backend 2>/dev/null | grep -i "Started.*Application\|Started.*in.*seconds" > /dev/null; then
          echo "✅ 后端应用已启动（$i秒）"
          break
        fi
        echo "等待后端应用完全启动...($i/15)"
        sleep 4
        i=$((i + 1))
      done
      
      # 前端应用启动检查
      echo ""
      echo "🔍 检查前端应用启动..."
      i=1
      while [ $i -le 10 ]; do
        if curl -s -o /dev/null -w "%{{http_code}}" "http://49.233.185.174" --max-time 5 2>/dev/null | grep -q "200"; then
          echo "✅ 前端应用已启动（$i秒）"
          break
        fi
        echo "等待前端应用完全启动...($i/10)"
        sleep 5
        i=$((i + 1))
      done
      
      # 4. 最终报告
      echo ""
      echo "========== 部署完成报告 =========="
      
      echo "📊 容器状态:"
      docker ps --filter "name=article-backend" --format "table {{{{.Names}}}}\t{{{{.Status}}}}\t{{{{.Ports}}}}" || echo "获取后端容器状态失败"
      docker ps --filter "name=article-frontend" --format "table {{{{.Names}}}}\t{{{{.Status}}}}\t{{{{.Ports}}}}" || echo "获取前端容器状态失败"
      
      echo ""
      echo "📝 后端最后5行日志:"
      docker logs article-backend --tail 5 2>/dev/null || echo "无法获取后端日志"
      
      echo ""
      echo "✅ 部署作业已完成"
      echo "前端已成功启动，可通过以下地址访问:"
      echo "🌐 http://49.233.185.174"
      echo "后端API可通过以下地址访问:"
      echo "🌐 http://49.233.185.174:8081/api/articles"
      echo ""
      echo "提示: 如果API无响应，请稍等1-2分钟让应用完全初始化"
      echo "手动检查: docker logs article-backend 或 docker logs article-frontend"
      echo "========== 结束 =========="
  needs: ["build-backend", "build-frontend"]
  only:
    - feature/initial-commit
  tags:
    - docker
