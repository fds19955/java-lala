stages:
  - test-aliyun
  - build-backend
  - build-frontend
  - push-images
  - k3s-deploy

variables:
  KUBE_NAMESPACE: "article-system"
  DOCKER_REGISTRY: "crpi-qaxlisuwj9fp5gv9.cn-beijing.personal.cr.aliyuncs.com"
  DOCKER_NAMESPACE: "fds-article"
  ALIYUN_REGISTRY_USER: "nick1191472774"
  ALIYUN_REGISTRY_PASSWORD: $ALIYUN_REGISTRY_PASSWORD
  MYSQL_ROOT_PASSWORD: $DB_ROOT_PASSWORD
  MYSQL_DATABASE: "article_db"

# ========== 阶段0：阿里云测试 ==========
test-aliyun:
  stage: test-aliyun
  image: docker:24.0.7
  script:
    - |
      echo "$ALIYUN_REGISTRY_PASSWORD" | docker login -u "$ALIYUN_REGISTRY_USER" --password-stdin "$DOCKER_REGISTRY"
  tags:
    - docker

# ========== 阶段1：构建后端 ==========
build-backend:
  stage: build-backend
  image: maven:3.9.8-eclipse-temurin-17
  script:
    - |
      echo "🚀 开始构建后端应用..."
      mkdir -p ~/.m2
      cat > ~/.m2/settings.xml << 'EOF'
      <?xml version="1.0" encoding="UTF-8"?>
      <settings>
        <mirrors>
          <mirror>
            <id>alimaven</id>
            <name>aliyun maven</name>
            <url>https://maven.aliyun.com/repository/public</url>
            <mirrorOf>central</mirrorOf>
          </mirror>
        </mirrors>
      </settings>
      EOF
      cd backend
      mvn clean package -DskipTests
  artifacts:
    paths:
      - backend/target/*.jar
    expire_in: 1 hour
  only:
    - feature/initial-commit
    - main
    - develop
  tags:
    - docker

# ========== 阶段2：构建前端 ==========
build-frontend:
  stage: build-frontend
  image: node:20-alpine
  script:
    - |
      echo "🎨 开始构建前端应用..."
      if [ ! -d "frontend" ]; then
        echo "⚠️ 前端目录不存在，跳过构建"
        exit 0
      fi
      cd frontend
      npm config set registry https://registry.npmmirror.com
      npm install --silent
      npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour
  only:
    - feature/initial-commit
    - main
    - develop
  tags:
    - docker
# ========== 阶段3：推送镜像到阿里云仓库 ==========
push-images:
  stage: push-images
  image: docker:24.0.7
  needs:
    - build-backend
    - build-frontend
  before_script:
    - apk add --no-cache curl
    - docker --version
  script:
    - |
      set -e # 遇到错误立即退出，避免累积错误
      echo "🚀 开始镜像推送流程..."

      # 1. 登录阿里云镜像仓库 (简化判断)
      echo "🔐 登录阿里云镜像仓库..."
      if [ -z "$ALIYUN_REGISTRY_PASSWORD" ]; then
        echo "❌ 错误：环境变量 ALIYUN_REGISTRY_PASSWORD 未设置或为空"
        exit 1
      fi
      echo "$ALIYUN_REGISTRY_PASSWORD" | docker login -u "$ALIYUN_REGISTRY_USER" --password-stdin "$DOCKER_REGISTRY"
      echo "✅ 阿里云仓库登录成功"

      # 2. 构建并推送后端镜像 (使用 echo 逐行创建 Dockerfile，避免 HEREDOC)
      echo "📦 构建后端镜像..."
      echo "FROM eclipse-temurin:17-jre-alpine" > Dockerfile.backend
      echo "WORKDIR /app" >> Dockerfile.backend
      echo "COPY backend/target/*.jar app.jar" >> Dockerfile.backend
      echo "EXPOSE 8080" >> Dockerfile.backend
      echo 'ENTRYPOINT ["java", "-jar", "app.jar"]' >> Dockerfile.backend

      BACKEND_IMAGE_TAG="${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/article-backend:${CI_COMMIT_SHORT_SHA}"
      LATEST_TAG="${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/article-backend:latest"

      docker build -f Dockerfile.backend -t "$BACKEND_IMAGE_TAG" .
      docker tag "$BACKEND_IMAGE_TAG" "$LATEST_TAG"
      echo "✅ 后端镜像构建完成"

      echo "📤 推送后端镜像..."
      docker push "$BACKEND_IMAGE_TAG"
      docker push "$LATEST_TAG"
      echo "✅ 后端镜像推送完成: $BACKEND_IMAGE_TAG"

      # 3. 构建并推送前端镜像（如果存在）- 修复 if 语句结构
      if [ -d "frontend/dist" ] && [ -n "$(ls -A frontend/dist 2>/dev/null)" ]; then
        echo "📦 构建前端镜像..."
        echo "FROM nginx:alpine" > frontend/Dockerfile.frontend
        echo "COPY dist/ /usr/share/nginx/html" >> frontend/Dockerfile.frontend
        echo "COPY nginx.conf /etc/nginx/conf.d/default.conf" >> frontend/Dockerfile.frontend # 这行没加，找bug找好久
        echo "EXPOSE 80" >> frontend/Dockerfile.frontend

        FRONTEND_IMAGE_TAG="${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/article-frontend:${CI_COMMIT_SHORT_SHA}"
        FRONTEND_LATEST="${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/article-frontend:latest"

        docker build -f frontend/Dockerfile.frontend -t "$FRONTEND_IMAGE_TAG" frontend/
        docker tag "$FRONTEND_IMAGE_TAG" "$FRONTEND_LATEST"
        echo "✅ 前端镜像构建完成"

        echo "📤 推送前端镜像..."
        docker push "$FRONTEND_IMAGE_TAG"
        docker push "$FRONTEND_LATEST"
        echo "✅ 前端镜像推送完成"
        FRONTEND_DEPLOY_INFO="前端: ${FRONTEND_IMAGE_TAG}"
      else
        echo "ℹ️ 前端构建产物不存在，跳过前端镜像构建"
        FRONTEND_DEPLOY_INFO="前端: 未构建"
      fi

      # 4. 验证推送
      echo "🔍 验证镜像推送..."
      if docker pull "$BACKEND_IMAGE_TAG"; then
        echo "✅ 后端镜像验证成功"
      else
        echo "❌ 后端镜像验证失败"
        exit 1
      fi

      # 5. 生成报告
      echo ""
      echo "========== 镜像推送报告 =========="
      echo "✅ 推送成功的镜像:"
      docker images | grep "$DOCKER_REGISTRY/$DOCKER_NAMESPACE" || echo "无相关镜像"
      echo ""
      echo "🔗 镜像地址:"
      echo "后端: $BACKEND_IMAGE_TAG"
      echo "$FRONTEND_DEPLOY_INFO"
      echo "✅ 镜像推送阶段完成"
      
  only:
    - feature/initial-commit
    - main
    - develop
  tags:
    - docker

# ========== 阶段4：K3s部署 ==========
k3s-deploy:
  stage: k3s-deploy
  image: alpine/k8s:1.29.4  # 使用包含kubectl的镜像
  needs:
    - push-images
  before_script:
    - |
      # 安装必要的工具
      apk add --no-cache gettext bash curl
      # 配置kubeconfig
      mkdir -p ~/.kube
      if [ -f "/etc/rancher/k3s/k3s.yaml" ]; then
        echo "🔧 配置K3s kubeconfig..."
        cp /etc/rancher/k3s/k3s.yaml ~/.kube/config
        # 更新server地址
        sed -i 's/127.0.0.1/'"$(hostname -I | awk '{print $1}')"'/g' ~/.kube/config
      else
        echo "⚠️ 未找到k3s.yaml，使用现有配置"
      fi
      # 测试集群连接
      kubectl cluster-info
      kubectl get nodes
  script:
    - |
      set -e
      echo "🚀 开始K3s部署..."
      
      # 1. 创建命名空间
      echo "📁 创建命名空间..."
      kubectl apply -f k8s/namespace.yaml

      # 2. 生成配置目录
      mkdir -p k8s/generated
      
      # 3. 处理secret配置
      echo "🔐 生成secret配置..."
      envsubst < k8s/secret.yaml > k8s/generated/secret.yaml
      
      # 4. 处理deployment配置
      echo "🔧 生成deployment配置..."
      sed -e "s|\\\${DOCKER_REGISTRY}|${DOCKER_REGISTRY}|g" \
          -e "s|\\\${DOCKER_NAMESPACE}|${DOCKER_NAMESPACE}|g" \
          -e "s|\\\${CI_COMMIT_SHORT_SHA}|${CI_COMMIT_SHORT_SHA}|g" \
          k8s/backend-deployment.yaml > k8s/generated/backend-deployment.yaml
      
      # 如果前端镜像存在，处理前端配置
      if docker manifest inspect "${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/article-frontend:${CI_COMMIT_SHORT_SHA}" >/dev/null 2>&1; then
        sed -e "s|\\\${DOCKER_REGISTRY}|${DOCKER_REGISTRY}|g" \
            -e "s|\\\${DOCKER_NAMESPACE}|${DOCKER_NAMESPACE}|g" \
            -e "s|\\\${CI_COMMIT_SHORT_SHA}|${CI_COMMIT_SHORT_SHA}|g" \
            k8s/frontend-deployment.yaml > k8s/generated/frontend-deployment.yaml
        FRONTEND_DEPLOY=true
      else
        echo "ℹ️ 前端镜像不存在，跳过前端部署"
        FRONTEND_DEPLOY=false
      fi

      # 5. 部署基础资源
      echo "📦 部署基础资源..."
      kubectl apply -f k8s/configmap.yaml
      kubectl apply -f k8s/generated/secret.yaml

      # 6. 部署数据库
      echo "🐬 部署MySQL数据库..."
      kubectl apply -f k8s/mysql-master.yaml
      kubectl apply -f k8s/mysql-slave.yaml

      # 7. 等待数据库就绪
      echo "⏳ 等待MySQL启动..."
      if kubectl wait --for=condition=ready pod -l app=mysql,role=master -n $KUBE_NAMESPACE --timeout=300s 2>/dev/null; then
        echo "✅ MySQL主节点就绪"
      else
        echo "⚠️ MySQL启动超时，继续部署..."
      fi

      # 8. 数据库初始化
      if [ -f "mysql/init/article_db.sql" ]; then
        echo "📊 初始化数据库..."
        # 使用临时Pod执行SQL
        kubectl run mysql-init --rm -i --restart='Never' --image=mysql:8.0 -n $KUBE_NAMESPACE -- \
          bash -c "cat /tmp/init.sql | mysql -h mysql-master.article-system.svc.cluster.local -uroot -p$MYSQL_ROOT_PASSWORD article_db" < mysql/init/article_db.sql
      fi

      # 9. 部署Redis
      echo "🔴 部署Redis..."
      kubectl apply -f k8s/redis.yaml

      # 10. 部署应用服务
      echo "🚀 部署后端服务..."
      kubectl apply -f k8s/generated/backend-deployment.yaml

      if [ "$FRONTEND_DEPLOY" = true ]; then
        echo "🚀 部署前端服务..."
        kubectl apply -f k8s/generated/frontend-deployment.yaml
      fi

      # 11. 部署网络服务
      echo "🌐 部署网络服务..."
      kubectl apply -f k8s/ingress.yaml
      kubectl apply -f k8s/hpa.yaml

      # 12. 等待应用就绪
      echo "⏳ 等待应用启动..."
      timeout 180 bash -c 'until kubectl get pods -n $KUBE_NAMESPACE -l app=article-backend 2>/dev/null | grep -q "Running"; do sleep 5; echo "等待后端Pod..."; done'
      
      if [ "$FRONTEND_DEPLOY" = true ]; then
        timeout 120 bash -c 'until kubectl get pods -n $KUBE_NAMESPACE -l app=article-frontend 2>/dev/null | grep -q "Running"; do sleep 5; echo "等待前端Pod..."; done'
      fi

      # 13. 部署验证
      echo "🧪 部署验证..."
      echo "=== Pod状态 ==="
      kubectl get pods -n $KUBE_NAMESPACE -o wide
      
      echo "=== 服务状态 ==="
      kubectl get svc -n $KUBE_NAMESPACE
      
      echo "=== Ingress状态 ==="
      kubectl get ingress -n $KUBE_NAMESPACE 2>/dev/null || echo "Ingress未部署"

      # 14. 健康检查
      echo "❤️ 健康检查..."
      BACKEND_POD=$(kubectl get pods -n $KUBE_NAMESPACE -l app=article-backend -o name 2>/dev/null | head -1)
      if [ -n "$BACKEND_POD" ]; then
        if kubectl exec -n $KUBE_NAMESPACE $BACKEND_POD -- sh -c "wget -q -O- http://localhost:8080/actuator/health" | grep -q "UP"; then
          echo "✅ 后端服务健康检查通过"
        else
          echo "⚠️ 后端服务健康检查失败"
        fi
      else
        echo "⚠️ 未找到后端Pod"
      fi

      # 15. 生成报告
      echo ""
      echo "========== K3s部署完成报告 =========="
      echo "🎉 跨云部署完成!"
      echo ""
      echo "📊 集群节点:"
      kubectl get nodes -o wide
      echo ""
      echo "🔧 运维命令:"
      echo "  查看所有Pod: kubectl get pods -n $KUBE_NAMESPACE -o wide"
      echo "  查看后端日志: kubectl logs -f deployment/article-backend -n $KUBE_NAMESPACE"
      echo "  进入Pod: kubectl exec -it <pod-name> -n $KUBE_NAMESPACE -- sh"
      echo ""
      echo "✅ K3s CI/CD流水线执行完成"
  only:
    - feature/initial-commit
    - main
    - develop
  tags:
    - k3s  # 关键修复：使用k3s标签而不是docker标签
