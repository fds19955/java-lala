stages:
  - build
  - deploy

build:
  stage: build
  image: docker:24.0.7
  variables:
    IMAGE_NAME: "49.233.185.174:5000/fds/java-lala:latest"
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
  script:
    # 先创建Docker配置目录，再生成配置文件
    - mkdir -p ~/.docker
    - |
      cat > ~/.docker/config.json << 'EOF'
      {"insecure-registries": ["49.233.185.174:5000", "article-gitlab:5000"]}
      EOF
    # Docker登录
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin 49.233.185.174:5000
    # 构建并推送镜像
    - docker build --add-host article-gitlab:49.233.185.174 -t $IMAGE_NAME ./backend
    - docker push $IMAGE_NAME
  only:
    - feature/initial-commit
  tags:
    - docker

deploy:
  stage: deploy
  image: ubuntu:22.04
  before_script:
    - apt update && apt install -y openssh-client docker.io docker-compose
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan $DEPLOY_SERVER >> ~/.ssh/known_hosts
  script:
    - scp docker-compose.yml $DEPLOY_USER@$DEPLOY_SERVER:/home/ubuntu/article-fds/
    # 在部署服务器上先创建Docker配置目录，再生成配置文件
    - |
      ssh $DEPLOY_USER@$DEPLOY_SERVER '
      mkdir -p ~/.docker
      cat > ~/.docker/config.json << "EOF"
      {"insecure-registries": ["49.233.185.174:5000"]}
      EOF
      '
    # Docker登录
    - ssh $DEPLOY_USER@$DEPLOY_SERVER "echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin 49.233.185.174:5000"
    # 启动服务
    - ssh $DEPLOY_USER@$DEPLOY_SERVER "cd /home/ubuntu/article-fds && docker compose up -d --pull always"
  only:
    - feature/initial-commit
  tags:
    - docker
