stages:
  - test-aliyun
  - build-backend
  - build-frontend
  - push-images
  - deploy-db
  - deploy

variables:
  DOCKER_HOST: "unix:///var/run/docker.sock"
  DOCKER_TLS_CERTDIR: ""
  MYSQL_ROOT_PASSWORD: $DB_ROOT_PASSWORD
  MYSQL_DATABASE: "article_db"
  DOCKER_REGISTRY: "crpi-qaxlisuwj9fp5gv9.cn-beijing.personal.cr.aliyuncs.com"
  DOCKER_NAMESPACE: "fds-article"
  ALIYUN_REGISTRY_USER: "nick1191472774"
  ALIYUN_REGISTRY_PASSWORD: $ALIYUN_REGISTRY_PASSWORD
  KUBECONFIG: $KUBECONFIG_BASE64
# ========== 阶段0：阿里云测试 ==========
test-aliyun:
  stage: test-aliyun
  image: docker:24.0.7  # 添加这一行
  script:
    - |
      # 添加调试信息
      echo "🔍 调试信息:"
      echo "用户名: $ALIYUN_REGISTRY_USER"
      echo "仓库: $DOCKER_REGISTRY"
      echo "命名空间: $DOCKER_NAMESPACE"
      echo "密码长度: ${#ALIYUN_REGISTRY_PASSWORD} 字符"
      
      # 测试echo到docker login
      echo "测试密码传递..."
      echo "密码前4位: ${ALIYUN_REGISTRY_PASSWORD:0:4}****"
      
      # 直接测试登录
      echo "$ALIYUN_REGISTRY_PASSWORD" | docker login -u "$ALIYUN_REGISTRY_USER" --password-stdin "$DOCKER_REGISTRY"

# ========== 阶段1：构建后端 ==========
build-backend:
  stage: build-backend
  image: maven:3.9.8-eclipse-temurin-17
  script:
    - |
      echo "🚀 开始构建后端应用..."
      
      # 创建Maven阿里云镜像配置
      mkdir -p ~/.m2
      cat > ~/.m2/settings.xml << 'EOF'
      <?xml version="1.0" encoding="UTF-8"?>
      <settings>
        <mirrors>
          <mirror>
            <id>alimaven</id>
            <name>aliyun maven</name>
            <url>https://maven.aliyun.com/repository/public</url>
            <mirrorOf>central</mirrorOf>
          </mirror>
        </mirrors>
      </settings>
      EOF
      
      echo "📦 进入backend目录编译..."
      cd backend
      mvn clean package -DskipTests
      
      echo "✅ 后端构建完成"
      echo "构建产物:"
      ls -lh target/*.jar
  artifacts:
    paths:
      - backend/target/*.jar
    expire_in: 1 hour
  only:
    - feature/initial-commit
    - main
    - develop
  tags:
    - docker

# ========== 阶段2：构建前端 ==========
build-frontend:
  stage: build-frontend
  image: node:20-alpine
  script:
    - |
      echo "🎨 开始构建前端应用..."
      
      if [ ! -d "frontend" ]; then
        echo "⚠️ 前端目录不存在，跳过构建"
        exit 0
      fi
      
      cd frontend
      
      # 设置npm镜像源
      npm config set registry https://registry.npmmirror.com
      
      echo "📦 安装依赖..."
      npm install --silent
      
      echo "🔨 执行构建..."
      npm run build
      
      echo "✅ 前端构建完成"
      echo "构建产物:"
      ls -lh dist/
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour
  only:
    - feature/initial-commit
    - main
    - develop
  tags:
    - docker
  
# 阶段3：推送镜像
push-images:
  stage: push-images
  image: docker:24.0.7
  needs:
    - build-backend
    - build-frontend
  script:
    - |
      set -e
      echo "🚀 开始镜像推送流程..."
      
      # 登录仓库
      echo "$ALIYUN_REGISTRY_PASSWORD" | docker login -u "$ALIYUN_REGISTRY_USER" --password-stdin "$DOCKER_REGISTRY"
      
      # 构建并推送后端镜像（使用commit SHA作为标签）
      BACKEND_IMAGE_TAG="${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/article-backend:${CI_COMMIT_SHORT_SHA}"
      docker build -t $BACKEND_IMAGE_TAG -t $DOCKER_REGISTRY/$DOCKER_NAMESPACE/article-backend:latest ./backend
      docker push $BACKEND_IMAGE_TAG
      docker push $DOCKER_REGISTRY/$DOCKER_NAMESPACE/article-backend:latest
      
      # 构建并推送前端镜像（如果存在）
      if [ -d "frontend/dist" ]; then
        FRONTEND_IMAGE_TAG="${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/article-frontend:${CI_COMMIT_SHORT_SHA}"
        docker build -t $FRONTEND_IMAGE_TAG -t $DOCKER_REGISTRY/$DOCKER_NAMESPACE/article-frontend:latest ./frontend
        docker push $FRONTEND_IMAGE_TAG
        docker push $DOCKER_REGISTRY/$DOCKER_NAMESPACE/article-frontend:latest
      fi
      echo "✅ 镜像推送完成"
  only:
    - feature/initial-commit
    - main
    - develop
  tags:
    - docker

# 阶段4：部署数据库
deploy-db:
  stage: deploy-db
  image: bitnami/kubectl:1.29
  needs: ["test-aliyun"]
  script:
    - |
      set -e
      echo "🔧 开始部署数据库..."
      mkdir -p ~/.kube
      echo "$KUBECONFIG" | base64 -d > ~/.kube/config
      
      # 应用命名空间和Secret
      kubectl apply -f k8s/namespace.yaml
      kubectl apply -f k8s/secrets/
      
      # 部署MySQL
      kubectl apply -f k8s/mysql/
      
      # 等待MySQL就绪
      echo "⏳ 等待MySQL就绪..."
      kubectl wait --for=condition=ready pod -l app=mysql-master -n article-system --timeout=300s
      echo "✅ 数据库部署完成"
  when: manual
  only:
    - feature/initial-commit
    - main
    - develop
  tags:
    - docker

# 阶段5：部署应用
deploy:
  stage: deploy
  image: bitnami/kubectl:1.29
  needs:
    - push-images
    - deploy-db
  script:
    - |
      set -e
      echo "🚀 开始部署应用..."
      mkdir -p ~/.kube
      echo "$KUBECONFIG" | base64 -d > ~/.kube/config
      
      # 更新镜像标签在Deployment中
      kubectl set image deployment/article-backend article-backend=$DOCKER_REGISTRY/$DOCKER_NAMESPACE/article-backend:${CI_COMMIT_SHORT_SHA} -n article-system
      kubectl set image deployment/article-frontend article-frontend=$DOCKER_REGISTRY/$DOCKER_NAMESPACE/article-frontend:${CI_COMMIT_SHORT_SHA} -n article-system
      
      # 应用部署配置
      kubectl apply -f k8s/backend/
      kubectl apply -f k8s/frontend/
      
      # 等待部署完成
      kubectl rollout status deployment/article-backend -n article-system --timeout=300s
      kubectl rollout status deployment/article-frontend -n article-system --timeout=300s
      echo "✅ 应用部署完成"
  only:
    - feature/initial-commit
    - main
    - develop
  tags:
    - docker
