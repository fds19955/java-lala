variables:
  DEPLOY_SERVER: "49.233.185.174"
  DEPLOY_USER: "ubuntu"
  JAR_NAME: "app.jar"

deploy-to-tencent:
  stage: deploy
  image: maven:3.9.8-eclipse-temurin-17
  before_script:
    - apt update && apt install -y openssh-client
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan $DEPLOY_SERVER >> ~/.ssh/known_hosts
  script:
    - echo "🔨 正在构建项目..."
    - mvn clean package -DskipTests
    
    - echo "📦 上传JAR包到腾讯云服务器..."
    - scp target/$JAR_NAME $DEPLOY_USER@$DEPLOY_SERVER:/home/$DEPLOY_USER/
    
    - echo "🚀 启动后端服务..."
    - 'ssh $DEPLOY_USER@$DEPLOY_SERVER << '\''EOF'\'''
    - 'pkill -f "java -jar $JAR_NAME" || true'
    - 'sleep 3'
    - 'cd /home/$DEPLOY_USER/'
    - 'nohup java -jar $JAR_NAME --server.port=8080 > /dev/null 2>&1 &'
    - 'sleep 5'
    - 'if pgrep -f "java -jar $JAR_NAME" > /dev/null; then'
    - '  echo "✅ 部署成功！访问地址：http://$DEPLOY_SERVER:8080"'
    - 'else'
    - '  echo "❌ 启动失败，请检查日志"'
    - '  exit 1'
    - 'fi'
    - 'EOF'
  only:
    - feature/initial-commit
