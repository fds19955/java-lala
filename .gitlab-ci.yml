stages:
  - test-aliyun
  - build-backend
  - build-frontend
  - push-images
  - deploy-db
  - deploy
  - deploy-ingress

variables:
  DOCKER_HOST: "unix:///var/run/docker.sock"
  DOCKER_TLS_CERTDIR: ""
  MYSQL_ROOT_PASSWORD: $DB_ROOT_PASSWORD
  MYSQL_DATABASE: "article_db"
  DOCKER_REGISTRY: "crpi-qaxlisuwj9fp5gv9.cn-beijing.personal.cr.aliyuncs.com"
  DOCKER_NAMESPACE: "fds-article"
  ALIYUN_REGISTRY_USER: "nick1191472774"
  ALIYUN_REGISTRY_PASSWORD: $ALIYUN_REGISTRY_PASSWORD
  KUBECONFIG_BASE64: $KUBECONFIG_BASE64
  # 用了自己的私有镜像仓库打包的镜像，提速
  KUBECTL_IMAGE: "crpi-qaxlisuwj9fp5gv9.cn-beijing.personal.cr.aliyuncs.com/fds-article/kubectl:1.29.0"


# ========== 阶段0：阿里云测试 ==========
test-aliyun:
  stage: test-aliyun
  image: docker:24.0.7  # 添加这一行
  script:
    - |
      # 添加调试信息
      echo "🔍 调试信息:"
      echo "用户名: $ALIYUN_REGISTRY_USER"
      echo "仓库: $DOCKER_REGISTRY"
      echo "命名空间: $DOCKER_NAMESPACE"
      echo "密码长度: ${#ALIYUN_REGISTRY_PASSWORD} 字符"
      
      # 测试echo到docker login
      echo "测试密码传递..."
      echo "密码前4位: ${ALIYUN_REGISTRY_PASSWORD:0:4}****"
      
      # 直接测试登录
      echo "$ALIYUN_REGISTRY_PASSWORD" | docker login -u "$ALIYUN_REGISTRY_USER" --password-stdin "$DOCKER_REGISTRY"

# ========== 阶段1：构建后端 ==========
build-backend:
  stage: build-backend
  image: maven:3.9.8-eclipse-temurin-17
  script:
    - |
      echo "🚀 开始构建后端应用..."
      
      # 创建Maven阿里云镜像配置
      mkdir -p ~/.m2
      cat > ~/.m2/settings.xml << 'EOF'
      <?xml version="1.0" encoding="UTF-8"?>
      <settings>
        <mirrors>
          <mirror>
            <id>alimaven</id>
            <name>aliyun maven</name>
            <url>https://maven.aliyun.com/repository/public</url>
            <mirrorOf>central</mirrorOf>
          </mirror>
        </mirrors>
      </settings>
      EOF
      
      echo "📦 进入backend目录编译..."
      cd backend
      mvn clean package -DskipTests
      
      echo "✅ 后端构建完成"
      echo "构建产物:"
      ls -lh target/*.jar
  artifacts:
    paths:
      - backend/target/*.jar
    expire_in: 1 hour
  only:
    - feature/initial-commit
    - main
    - develop
  tags:
    - docker

# ========== 阶段2：构建前端 ==========
build-frontend:
  stage: build-frontend
  image: node:20-alpine
  script:
    - |
      echo "🎨 开始构建前端应用..."
      
      if [ ! -d "frontend" ]; then
        echo "⚠️ 前端目录不存在，跳过构建"
        exit 0
      fi
      
      cd frontend
      
      # 设置npm镜像源
      npm config set registry https://registry.npmmirror.com
      
      echo "📦 安装依赖..."
      npm install --silent
      
      echo "🔨 执行构建..."
      npm run build
      
      echo "✅ 前端构建完成"
      echo "构建产物:"
      ls -lh dist/
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour
  only:
    - feature/initial-commit
    - main
    - develop
  tags:
    - docker

# ========== 阶段3：推送镜像到阿里云仓库 ==========
push-images:
  stage: push-images
  image: docker:24.0.7
  needs:
    - build-backend
    - build-frontend
  before_script:
    - apk add --no-cache curl
    - docker --version
  script:
    - |
      set -e # 遇到错误立即退出，避免累积错误
      echo "🚀 开始镜像推送流程..."

      # 1. 登录阿里云镜像仓库 (简化判断)
      echo "🔐 登录阿里云镜像仓库..."
      if [ -z "$ALIYUN_REGISTRY_PASSWORD" ]; then
        echo "❌ 错误：环境变量 ALIYUN_REGISTRY_PASSWORD 未设置或为空"
        exit 1
      fi
      echo "$ALIYUN_REGISTRY_PASSWORD" | docker login -u "$ALIYUN_REGISTRY_USER" --password-stdin "$DOCKER_REGISTRY"
      echo "✅ 阿里云仓库登录成功"

      # 2. 构建并推送后端镜像 (使用 echo 逐行创建 Dockerfile，避免 HEREDOC)
      echo "📦 构建后端镜像..."
      echo "FROM eclipse-temurin:17-jre-alpine" > Dockerfile.backend
      echo "WORKDIR /app" >> Dockerfile.backend
      echo "COPY backend/target/*.jar app.jar" >> Dockerfile.backend
      echo "EXPOSE 8080" >> Dockerfile.backend
      echo 'ENTRYPOINT ["java", "-jar", "app.jar"]' >> Dockerfile.backend

      BACKEND_IMAGE_TAG="${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/article-backend:${CI_COMMIT_SHORT_SHA}"
      LATEST_TAG="${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/article-backend:latest"

      docker build -f Dockerfile.backend -t "$BACKEND_IMAGE_TAG" .
      docker tag "$BACKEND_IMAGE_TAG" "$LATEST_TAG"
      echo "✅ 后端镜像构建完成"

      echo "📤 推送后端镜像..."
      docker push "$BACKEND_IMAGE_TAG"
      docker push "$LATEST_TAG"
      echo "✅ 后端镜像推送完成: $BACKEND_IMAGE_TAG"

      # 3. 构建并推送前端镜像（如果存在）- 修复 if 语句结构
      if [ -d "frontend/dist" ] && [ -n "$(ls -A frontend/dist 2>/dev/null)" ]; then
        echo "📦 构建前端镜像..."
        echo "FROM nginx:alpine" > frontend/Dockerfile.frontend
        echo "COPY dist/ /usr/share/nginx/html" >> frontend/Dockerfile.frontend
        echo "COPY nginx.conf /etc/nginx/conf.d/default.conf" >> frontend/Dockerfile.frontend # 这行没加，找bug找好久
        echo "EXPOSE 80" >> frontend/Dockerfile.frontend

        FRONTEND_IMAGE_TAG="${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/article-frontend:${CI_COMMIT_SHORT_SHA}"
        FRONTEND_LATEST="${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/article-frontend:latest"

        docker build -f frontend/Dockerfile.frontend -t "$FRONTEND_IMAGE_TAG" frontend/
        docker tag "$FRONTEND_IMAGE_TAG" "$FRONTEND_LATEST"
        echo "✅ 前端镜像构建完成"

        echo "📤 推送前端镜像..."
        docker push "$FRONTEND_IMAGE_TAG"
        docker push "$FRONTEND_LATEST"
        echo "✅ 前端镜像推送完成"
        FRONTEND_DEPLOY_INFO="前端: ${FRONTEND_IMAGE_TAG}"
      else
        echo "ℹ️ 前端构建产物不存在，跳过前端镜像构建"
        FRONTEND_DEPLOY_INFO="前端: 未构建"
      fi

      # 4. 验证推送
      echo "🔍 验证镜像推送..."
      if docker pull "$BACKEND_IMAGE_TAG"; then
        echo "✅ 后端镜像验证成功"
      else
        echo "❌ 后端镜像验证失败"
        exit 1
      fi

      # 5. 生成报告
      echo ""
      echo "========== 镜像推送报告 =========="
      echo "✅ 推送成功的镜像:"
      docker images | grep "$DOCKER_REGISTRY/$DOCKER_NAMESPACE" || echo "无相关镜像"
      echo ""
      echo "🔗 镜像地址:"
      echo "后端: $BACKEND_IMAGE_TAG"
      echo "$FRONTEND_DEPLOY_INFO"
      echo "✅ 镜像推送阶段完成"
      
  only:
    - feature/initial-commit
    - main
    - develop
  tags:
    - docker
    
# ========== 阶段4：部署数据库（使用私有镜像，包含SQL初始化） ==========
deploy-db:
  stage: deploy-db
  # 使用您构建的私有kubectl镜像
  image: crpi-qaxlisuwj9fp5gv9.cn-beijing.personal.cr.aliyuncs.com/fds-article/kubectl:1.29.0
  needs: ["push-images"]
  before_script:
    - |
      echo "🔧 验证环境..."
      kubectl version --client
      echo "✅ 使用预构建的镜像，所有工具已就绪"
  script:
    - |
      set -e
      echo "🐳 开始部署数据库..."
      mkdir -p ~/.kube

      # 1. 处理 KUBECONFIG_BASE64
      echo "🔍 处理 KUBECONFIG_BASE64 配置..."
      if [ -z "$KUBECONFIG_BASE64" ]; then
        echo "❌ 错误：KUBECONFIG_BASE64 变量为空"
        exit 1
      fi
      echo "$KUBECONFIG_BASE64" | base64 -d > ~/.kube/config
      export KUBECONFIG=~/.kube/config

      # 2. 验证集群连接
      echo "🔍 验证集群连接..."
      kubectl cluster-info
      kubectl get nodes -o wide

      # 3. 应用命名空间和 Secret，ingress
      echo "📁 创建命名空间和 Secret..."
      kubectl apply -f k8s/namespace.yaml
      kubectl apply -f k8s/secrets/

      # 4. 部署 MySQL
      echo "🚀 部署 MySQL StatefulSet 和 Service..."
      kubectl apply -f k8s/mysql/

      # 5. 等待 MySQL Pod 完全就绪 (关键步骤)
      echo "⏳ 等待 MySQL Pod 启动并变为 Ready..."
      kubectl wait --for=condition=ready pod -l app=mysql-master -n article-system --timeout=300s
      MASTER_POD=$(kubectl get pod -n article-system -l app=mysql-master -o jsonpath='{.items[0].metadata.name}')
      echo "✅ MySQL主Pod已就绪: $MASTER_POD"

      # 6. 等待MySQL服务内部真正可连接 (额外健康检查)
      echo "⏳ 等待MySQL服务接受连接..."
      for i in {1..30}; do
        if kubectl exec -n article-system $MASTER_POD -- mysql -uroot -p$DB_ROOT_PASSWORD -e "SELECT 1" &>/dev/null; then
          echo "✅ MySQL服务内部连接测试成功 ($i秒)"
          break
        fi
        if [ $i -eq 30 ]; then
          echo "❌ MySQL服务连接等待超时"
          kubectl logs -n article-system $MASTER_POD --tail=20
          exit 1
        fi
        echo "等待MySQL服务内部就绪... ($i/30)"
        sleep 2
      done

      # 7. 数据库初始化 - 核心修复部分 (从您成功的脚本迁移)
      echo "📁 检查并导入SQL初始化脚本..."
      SQL_FILE="mysql/init/article_db.sql"
      if [ -f "$SQL_FILE" ]; then
        echo "✅ 找到SQL初始化文件: $SQL_FILE"
        echo "文件信息:"
        wc -l "$SQL_FILE"
        echo "前3行内容预览:"
        head -3 "$SQL_FILE"

        # 7.1 确保数据库存在 (与您成功脚本逻辑一致)
        echo "确保数据库 $MYSQL_DATABASE 存在..."
        kubectl exec -n article-system $MASTER_POD -- mysql -uroot -p$DB_ROOT_PASSWORD \
          -e "CREATE DATABASE IF NOT EXISTS $MYSQL_DATABASE CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

        # 7.2 复制SQL文件到Pod内
        echo "复制SQL文件到Pod内部..."
        kubectl cp "$SQL_FILE" article-system/$MASTER_POD:/tmp/init.sql

        # 7.3 执行SQL导入
        echo "正在导入SQL文件到数据库 $MYSQL_DATABASE ..."
        kubectl exec -n article-system $MASTER_POD -- mysql -uroot -p$DB_ROOT_PASSWORD \
          $MYSQL_DATABASE -e "source /tmp/init.sql"

        if [ $? -eq 0 ]; then
          echo "✅ SQL文件导入成功"
          # 清理临时文件
          kubectl exec -n article-system $MASTER_POD -- rm -f /tmp/init.sql
        else
          echo "❌ SQL文件导入失败"
          echo "请检查SQL文件语法或查看Pod日志"
          kubectl logs -n article-system $MASTER_POD --tail=30
          exit 1
        fi
      else
        echo "⚠️ 警告：未找到SQL初始化文件: $SQL_FILE"
        echo "将仅创建空数据库 $MYSQL_DATABASE，表结构可能依赖后端自动迁移或手动创建。"
        kubectl exec -n article-system $MASTER_POD -- mysql -uroot -p$DB_ROOT_PASSWORD \
          -e "CREATE DATABASE IF NOT EXISTS $MYSQL_DATABASE CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
      fi

      # 8. 验证数据库初始化结果
      echo "🔍 验证数据库状态..."
      kubectl exec -n article-system $MASTER_POD -- mysql -uroot -p$DB_ROOT_PASSWORD $MYSQL_DATABASE -e "
        -- 显示所有表
        SHOW TABLES;
        -- 统计表数量
        SELECT CONCAT('数据库: ', '$MYSQL_DATABASE') AS '项目';
        SELECT '表总数' AS '统计项', COUNT(*) AS '数量' 
        FROM information_schema.tables 
        WHERE table_schema = '$MYSQL_DATABASE';
      " 2>/dev/null || echo "数据库查询完成，可能无表或仅显示基础信息。"

      echo "✅ 数据库部署与初始化全部完成"
  when: manual
  only:
    - feature/initial-commit
    - main
    - develop
  tags:
    - docker

# ========== 阶段5：部署前后端应用（使用私有镜像） ==========
deploy:
  stage: deploy
  # 使用您构建的私有kubectl镜像
  image: crpi-qaxlisuwj9fp5gv9.cn-beijing.personal.cr.aliyuncs.com/fds-article/kubectl:1.29.0
  needs: ["deploy-db"]  # 依赖deploy-db阶段
  before_script:
    - |
      echo "🔧 验证环境..."
      kubectl version --client
  script:
    - |
      set -e
      echo "🚀 开始部署应用..."
      mkdir -p ~/.kube
      
      # 智能处理KUBECONFIG_BASE64
      echo "🔍 处理KUBECONFIG_BASE64配置..."
      if echo "$KUBECONFIG_BASE64" | base64 -d > /dev/null 2>&1; then
        echo "📥 检测到base64编码，进行解码..."
        echo "$KUBECONFIG_BASE64" | base64 -d > ~/.kube/config
      else
        echo "📄 检测到已经是普通文本，直接写入..."
        echo "$KUBECONFIG_BASE64" > ~/.kube/config
      fi
      
      # 检查数据库状态
      echo "🔍 检查数据库状态..."
      kubectl get pods -n article-system -l app=mysql-master

      # 应用部署配置
      echo "📁 应用Kubernetes配置..."
      kubectl apply -f k8s/backend/
      if [ -d "k8s/frontend" ]; then
        kubectl apply -f k8s/frontend/
      fi
      
      # 更新后端镜像
      echo "🔄 更新应用镜像..."
      kubectl set image deployment/article-backend article-backend=$DOCKER_REGISTRY/$DOCKER_NAMESPACE/article-backend:${CI_COMMIT_SHORT_SHA} -n article-system --record
      
      # 如果前端部署存在，也更新前端
      if kubectl get deployment/article-frontend -n article-system &>/dev/null; then
        kubectl set image deployment/article-frontend article-frontend=$DOCKER_REGISTRY/$DOCKER_NAMESPACE/article-frontend:${CI_COMMIT_SHORT_SHA} -n article-system --record
      fi
      
      # 等待部署完成
      echo "⏳ 等待后端部署完成..."
      kubectl rollout status deployment/article-backend -n article-system --timeout=300s
      
      if kubectl get deployment/article-frontend -n article-system &>/dev/null; then
        echo "⏳ 等待前端部署完成..."
        kubectl rollout status deployment/article-frontend -n article-system --timeout=300s
      fi
      
      # 将前端Service改为ClusterIP（因为Ingress将作为入口）
      echo "🔧 将前端Service改为ClusterIP..."
      kubectl patch svc article-frontend -n article-system -p '{"spec":{"type":"ClusterIP"}}'

      echo "✅ 应用部署完成"
      echo "📊 部署状态:"
      kubectl get deployments,services,pods -n article-system
  only:
    - feature/initial-commit
    - main
    - develop
  tags:
    - docker

# ========== 阶段7：部署Ingress控制器和规则 ==========
deploy-ingress:
  stage: deploy-ingress
  image: $KUBECTL_IMAGE
  needs: ["deploy"]
  script:
    - |
      set -e
      echo "🌐 开始部署Ingress..."
      mkdir -p ~/.kube
      echo "$KUBECONFIG_BASE64" | base64 -d > ~/.kube/config
      export KUBECONFIG=~/.kube/config

      # 1. 部署Ingress控制器（如果尚未部署）
      echo "🚀 部署Ingress控制器..."
      # 检查是否已存在ingress-nginx命名空间
      if ! kubectl get namespace ingress-nginx &>/dev/null; then
        echo "📦 安装Nginx Ingress Controller..."
        kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/baremetal/deploy.yaml
      else
        echo "✅ Ingress控制器已存在"
      fi
      
      # 2. 等待Ingress控制器就绪
      echo "⏳ 等待Ingress控制器就绪..."
      kubectl wait --namespace ingress-nginx \
        --for=condition=ready pod \
        --selector=app.kubernetes.io/component=controller \
        --timeout=180s
      
      # 3. 应用Ingress路由规则
      echo "📄 应用Ingress路由规则..."
      kubectl apply -f k8s/ingress.yaml
      
      # 4. 获取Ingress访问信息
      echo "🔍 获取Ingress访问信息..."
      INGRESS_PORT=$(kubectl get svc -n ingress-nginx ingress-nginx-controller -o jsonpath='{.spec.ports[?(@.name=="http")].nodePort}')
      echo ""
      echo "🎉 部署完成！"
      echo "========================================"
      echo "🌐 应用访问地址: http://49.233.185.174:$INGRESS_PORT"
      echo "   - 首页: http://49.233.185.174:$INGRESS_PORT/"
      echo "   - API: http://49.233.185.174:$INGRESS_PORT/api/"
      echo "========================================"
      echo ""
      echo "📊 最终部署状态:"
      kubectl get all,ingress -n article-system
      
      echo "✅ Ingress部署完成"
  only:
    - feature/initial-commit
    - main
    - develop
  tags:
    - docker
