stages:
  - deploy

variables:
  DEPLOY_SERVER: "49.233.185.174"
  DEPLOY_USER: "ubuntu"

deploy-to-tencent:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan $DEPLOY_SERVER >> ~/.ssh/known_hosts
  script:
    - echo "📦 上传JAR包到腾讯云服务器..."
    - scp target/app.jar $DEPLOY_USER@$DEPLOY_SERVER:/home/$DEPLOY_USER/
    
    - echo "🚀 启动后端服务..."
    - 'ssh $DEPLOY_USER@$DEPLOY_SERVER << "EOF"'
    - 'pkill -f "java -jar app.jar" || true'
    - sleep 3
    - 'cd /home/$DEPLOY_USER/'
    - 'nohup java -jar app.jar --server.port=8080 > /dev/null 2>&1 &'
    - sleep 5
    - 'if pgrep -f "java -jar app.jar" > /dev/null; then'
    - '  echo "✅ 部署成功！访问地址：http://$DEPLOY_SERVER:8080"'
    - 'else'
    - '  echo "❌ 启动失败，请检查日志"'
    - '  exit 1'
    - 'fi'
    - 'EOF'
  only:
    - feature/initial-commit  # 只在你的分支触发
