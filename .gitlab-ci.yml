stages:
  - build
  - deploy

build:
  stage: build
  image: gcr.io/kaniko-project/executor:v1.22.0-debug  # 使用带调试工具的Kaniko镜像
  variables:
    IMAGE_NAME: "$CI_REGISTRY/fds/java-lala:latest"
  script:
    # 配置Kaniko认证（无需下载，直接使用内置的kaniko-executor）
    - mkdir -p /kaniko/.docker
    - echo '{"auths":{"'"$CI_REGISTRY"'":{"username":"'"$CI_REGISTRY_USER"'","password":"'"$CI_REGISTRY_PASSWORD"'"}}}' > /kaniko/.docker/config.json

    # 使用Kaniko构建并推送镜像
    - /kaniko/executor --context ./backend --dockerfile ./backend/Dockerfile --destination $IMAGE_NAME --insecure-registry $CI_REGISTRY
  only:
    - feature/initial-commit
  tags:
    - docker

deploy:
  stage: deploy
  image: ubuntu:22.04
  before_script:
    - apt update && apt install -y openssh-client docker.io docker-compose
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan $DEPLOY_SERVER >> ~/.ssh/known_hosts
  script:
    - scp docker-compose.yml $DEPLOY_USER@$DEPLOY_SERVER:/home/ubuntu/article-fds/
    - ssh $DEPLOY_USER@$DEPLOY_SERVER "cd /home/ubuntu/article-fds && echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY'"
    - ssh $DEPLOY_USER@$DEPLOY_SERVER "cd /home/ubuntu/article-fds && docker compose up -d --pull always"
  only:
    - feature/initial-commit
  tags:
    - docker
