stages:
  - build-backend
  - build-frontend
  - deploy-db
  - deploy

# ========== 全局配置 ==========
variables:
  DOCKER_HOST: "unix:///var/run/docker.sock"
  DOCKER_TLS_CERTDIR: ""
  # 敏感信息使用GitLab CI/CD变量，避免硬编码
  MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}  # 在GitLab项目设置中配置
  MYSQL_DATABASE: "article_db"
  DOCKER_NETWORK: "article-fds-net"
  MYSQL_CONTAINER: "article-mysql"
  REDIS_CONTAINER: "article-redis"

# ========== 阶段1：构建后端 ==========
build-backend:
  stage: build-backend
  image: maven:3.9.8-eclipse-temurin-17
  script:
    - |
      mkdir -p ~/.m2
      cat > ~/.m2/settings.xml << 'EOF'
      <?xml version="1.0" encoding="UTF-8"?>
      <settings>
        <mirrors>
          <mirror>
            <id>alimaven</id>
            <name>aliyun maven</name>
            <url>https://maven.aliyun.com/repository/public</url>  
            <mirrorOf>central</mirrorOf>
          </mirror>
        </mirrors>
      </settings>
      EOF
      
      cd backend
      mvn clean package -DskipTests
      ls -lh target/
  artifacts:
    paths:
      - backend/target/*.jar
  only:
    - feature/initial-commit
  tags:
    - docker

# ========== 阶段2：构建前端 ==========
build-frontend:
  stage: build-frontend
  image: node:20-alpine
  script:
    - echo "📦 开始构建前端..."
    - cd frontend
    - npm install --registry=https://registry.npmmirror.com  
    - npm run build
    - ls -lh dist/
  artifacts:
    paths:
      - frontend/dist/
  only:
    - feature/initial-commit
  tags:
    - docker

# ========== 阶段3：部署数据库（核心修复） ==========
deploy-db:
  stage: deploy-db
  image: docker:24.0.7
  before_script:
    - apk add --no-cache bash coreutils  # 安装必要工具
  script:
    - |
      set -euo pipefail  # 开启严格错误处理
      
      echo "========== 部署数据库服务 =========="
      
      # 1. 确保网络存在
      if ! docker network ls --format "{{.Name}}" | grep -q "^${DOCKER_NETWORK}$"; then
        echo "🔧 创建专用Docker网络: ${DOCKER_NETWORK}"
        docker network create "${DOCKER_NETWORK}"
      else
        echo "✅ Docker网络已存在: ${DOCKER_NETWORK}"
      fi
      
      # 2. 部署MySQL
      if docker ps --format "{{.Names}}" | grep -q "^${MYSQL_CONTAINER}$"; then
        echo "✅ MySQL容器已在运行"
      elif docker ps -a --format "{{.Names}}" | grep -q "^${MYSQL_CONTAINER}$"; then
        echo "🔄 重启已存在的MySQL容器"
        docker start "${MYSQL_CONTAINER}"
      else
        echo "🚀 创建并启动MySQL容器"
        docker run -d \
          --name "${MYSQL_CONTAINER}" \
          --restart unless-stopped \
          --network "${DOCKER_NETWORK}" \
          -p 3306:3306 \
          -e MYSQL_ROOT_PASSWORD="${MYSQL_ROOT_PASSWORD}" \
          -e MYSQL_DATABASE="${MYSQL_DATABASE}" \
          -v mysql-data:/var/lib/mysql \
          mysql:8.0 --default-authentication-plugin=mysql_native_password
      fi
      
      # 等待MySQL就绪
      echo "⏳ 等待MySQL初始化完成..."
      for i in {1..30}; do
        if docker exec "${MYSQL_CONTAINER}" mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" -e "SELECT 1" >/dev/null 2>&1; then
          echo "✅ MySQL已就绪"
          break
        fi
        if [ $i -eq 30 ]; then
          echo "❌ MySQL启动超时"
          docker logs "${MYSQL_CONTAINER}" --tail 20
          exit 1
        fi
        echo "初始化中...($i/30)"
        sleep 2
      done
      
      # 3. 部署Redis（修复核心逻辑）
      if docker ps --format "{{.Names}}" | grep -q "^${REDIS_CONTAINER}$"; then
        echo "✅ Redis容器已在运行"
      elif docker ps -a --format "{{.Names}}" | grep -q "^${REDIS_CONTAINER}$"; then
        echo "🔄 重启已存在的Redis容器"
        docker start "${REDIS_CONTAINER}"
      else
        echo "🚀 创建并启动Redis容器"
        docker run -d \
          --name "${REDIS_CONTAINER}" \
          --restart unless-stopped \
          --network "${DOCKER_NETWORK}" \
          -p 6379:6379 \
          -v redis-data:/data \
          redis:alpine redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
      fi
      
      # 验证Redis连接
      if docker exec "${REDIS_CONTAINER}" redis-cli ping | grep -q "PONG"; then
        echo "✅ Redis连接正常"
      else
        echo "❌ Redis连接失败"
        docker logs "${REDIS_CONTAINER}" --tail 20
        exit 1
      fi
      
      echo "========== 数据库部署完成 =========="
  only:
    - feature/initial-commit
  tags:
    - docker

# ========== 阶段4：部署前后端 ==========
deploy:
  stage: deploy
  image: docker:24.0.7
  needs: ["build-backend", "build-frontend", "deploy-db"]
  before_script:
    - apk add --no-cache bash coreutils
  script:
    - |
      set -euo pipefail
      
      echo "========== 部署应用服务 =========="
      
      # 1. 部署后端
      echo "🚀 部署后端服务..."
      
      # 检查JAR文件
      if ! ls backend/target/*.jar 1>/dev/null 2>&1; then
        echo "❌ 错误：未找到后端JAR文件"
        exit 1
      fi
      JAR_FILE=$(ls backend/target/*.jar | head -1)
      echo "✅ 找到JAR文件: ${JAR_FILE}"
      
      # 构建后端镜像
      cat > Dockerfile << 'EOF'
      FROM eclipse-temurin:17-jre
      WORKDIR /app
      COPY backend/target/*.jar app.jar
      EXPOSE 8080
      ENTRYPOINT ["java", "-jar", "app.jar"]
      EOF
      
      echo "📦 构建后端Docker镜像"
      docker build -t article-backend:latest .
      
      # 替换后端容器
      echo "🔄 替换后端容器"
      docker stop article-backend 2>/dev/null || true
      docker rm article-backend 2>/dev/null || true
      
      docker run -d \
        --name article-backend \
        --restart unless-stopped \
        --network "${DOCKER_NETWORK}" \
        -p 8081:8080 \
        -e SPRING_PROFILES_ACTIVE=prod \
        -e SPRING_DATASOURCE_URL='jdbc:mysql://article-mysql:3306/article_db?useSSL=false&serverTimezone=Asia/Shanghai' \
        -e SPRING_DATASOURCE_USERNAME=root \
        -e SPRING_DATASOURCE_PASSWORD="${MYSQL_ROOT_PASSWORD}" \
        -e SPRING_REDIS_HOST='article-redis' \
        -e SPRING_REDIS_PORT=6379 \
        -e SERVER_PORT=8080 \
        -e JAVA_OPTS='-Xmx512m -Xms256m' \
        article-backend:latest
      
      # 2. 部署前端
      echo "🚀 部署前端服务..."
      
      # 检查前端静态文件
      if [ ! -d "frontend/dist" ]; then
        echo "❌ 错误：未找到前端构建产物"
        exit 1
      fi
      
      # 构建前端镜像
      cat > frontend/Dockerfile << 'EOF'
      FROM nginx:alpine
      COPY dist /usr/share/nginx/html
      EXPOSE 80
      CMD ["nginx", "-g", "daemon off;"]
      EOF
      
      echo "📦 构建前端Docker镜像"
      docker build -t article-frontend:latest frontend/
      
      # 替换前端容器
      echo "🔄 替换前端容器"
      docker stop article-frontend 2>/dev/null || true
      docker rm article-frontend 2>/dev/null || true
      
      docker run -d \
        --name article-frontend \
        --restart unless-stopped \
        --network "${DOCKER_NETWORK}" \
        -p 80:80 \
        article-frontend:latest
      
      echo "========== 应用部署完成 =========="
  only:
    - feature/initial-commit
  tags:
    - docker
