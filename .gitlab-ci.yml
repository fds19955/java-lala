# 全栈应用CI/CD流水线
stages:
  - test
  - build
  - push
  - deploy

variables:
  # 使用GitLab Container Registry存储镜像
  REGISTRY: "$CI_REGISTRY_IMAGE"
  BACKEND_IMAGE: "$REGISTRY/backend:$CI_COMMIT_SHORT_SHA"
  FRONTEND_IMAGE: "$REGISTRY/frontend:$CI_COMMIT_SHORT_SHA"
  DOCKER_HOST: "tcp://docker:2375"
  # 目标服务器信息
  DEPLOY_SERVER: "49.233.185.174"
  DEPLOY_USER: "ubuntu"
  DEPLOY_PORT: "22"

# 使用Docker-in-Docker
services:
  - docker:20.10.16-dind

# 缓存依赖，加速构建
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - backend/.m2/repository
    - frontend/node_modules/

# 1. 后端代码测试
backend-test:
  stage: test
  image: maven:3.8.6-openjdk-17
  script:
    - cd backend
    - mvn clean test
  only:
    - feature/initial-commit
  tags:
    - docker

# 2. 前端代码测试（如果有）
frontend-test:
  stage: test
  image: node:16-alpine
  script:
    - cd frontend
    - npm install
    - npm run test -- --watchAll=false
  only:
    - feature/initial-commit
  tags:
    - docker

# 3. 构建后端Docker镜像
build-backend:
  stage: build
  image: docker:20.10.16
  script:
    - cd backend
    - docker build -t $BACKEND_IMAGE .
    - docker images
  artifacts:
    paths:
      - backend/target/*.jar
  only:
    - feature/initial-commit
  tags:
    - docker

# 4. 构建前端Docker镜像  
build-frontend:
  stage: build
  image: docker:20.10.16
  script:
    - cd frontend
    - docker build -t $FRONTEND_IMAGE .
    - docker images
  only:
    - feature/initial-commit
  tags:
    - docker

# 5. 推送镜像到GitLab Container Registry
push-images:
  stage: push
  image: docker:20.10.16
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u "$CI_REGISTRY_USER" --password-stdin
    - docker push $BACKEND_IMAGE
    - docker push $FRONTEND_IMAGE
  only:
    - feature/initial-commit
  tags:
    - docker

# 6. 部署到目标服务器
deploy-production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client docker-compose
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -p $DEPLOY_PORT $DEPLOY_SERVER >> ~/.ssh/known_hosts
  script:
    # 生成生产环境docker-compose文件
    - |
      cat > docker-compose.prod.yml << EOF
      version: '3.8'
      services:
        mysql-db:
          image: mysql:8.0
          container_name: article-mysql
          restart: unless-stopped
          environment:
            MYSQL_ROOT_PASSWORD: fds00913
            MYSQL_DATABASE: article_db
            TZ: Asia/Shanghai
          ports:
            - "3306:3306"
          volumes:
            - /home/ubuntu/mysql/data:/var/lib/mysql
          networks:
            - app-network

        redis:
          image: redis:alpine
          container_name: article-redis
          command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
          ports:
            - "6379:6379"
          networks:
            - app-network

        backend-app:
          image: $BACKEND_IMAGE
          container_name: article-backend
          restart: unless-stopped
          ports:
            - "8080:8080"
          environment:
            SPRING_PROFILES_ACTIVE: prod
            SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/article_db?useSSL=false&serverTimezone=Asia/Shanghai
            SPRING_DATASOURCE_USERNAME: root
            SPRING_DATASOURCE_PASSWORD: fds00913
          depends_on:
            - mysql-db
            - redis
          networks:
            - app-network

        frontend-app:
          image: $FRONTEND_IMAGE
          container_name: article-frontend
          restart: unless-stopped
          ports:
            - "80:80"
          depends_on:
            - backend-app
          networks:
            - app-network

      networks:
        app-network:
          driver: bridge
      EOF
    
    # 将docker-compose文件复制到目标服务器
    - scp -P $DEPLOY_PORT docker-compose.prod.yml $DEPLOY_USER@$DEPLOY_SERVER:/home/ubuntu/
    
    # 在目标服务器上部署应用
    - ssh -p $DEPLOY_PORT $DEPLOY_USER@$DEPLOY_SERVER << 'EOF'
        # 登录GitLab Container Registry
        echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u "$CI_REGISTRY_USER" --password-stdin
        
        # 停止旧容器并启动新容器
        cd /home/ubuntu/
        docker-compose -f docker-compose.prod.yml down
        docker-compose -f docker-compose.prod.yml pull
        docker-compose -f docker-compose.prod.yml up -d
        
        # 清理无用镜像
        docker image prune -f
        
        # 健康检查
        sleep 30
        docker ps
        echo "部署完成！应用访问地址：http://49.233.185.174"
      EOF
  only:
    - feature/initial-commit
  tags:
    - docker

