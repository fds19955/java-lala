stages:
  - build
  - deploy

# 构建阶段：解决Docker命令未找到问题 + 适配项目结构
build:
  stage: build
  image: maven:3.9.8-eclipse-temurin-17
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  before_script:
    # 关键：在Maven镜像中安装Docker客户端
    - apt update && apt install -y docker.io
  script:
    # 进入backend目录（pom.xml所在位置）
    - cd backend
    # 构建Java项目
    - mvn clean package -DskipTests
    # 登录GitLab Registry
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin --insecure-registry 49.233.185.174:5000 49.233.185.174:5000
    # 构建Docker镜像（上下文为backend目录）
    - docker build -t 49.233.185.174:5000/fds/java-lala:latest .
    # 推送Docker镜像到Registry
    - docker push --insecure-registry 49.233.185.174:5000 49.233.185.174:5000/fds/java-lala:latest
  only:
    - feature/initial-commit  # 仅在该分支触发
  tags:
    - docker
  cache:
    paths:
      - .m2/repository/

# 部署阶段：保持原配置不变
deploy:
  stage: deploy
  image: ubuntu:22.04
  before_script:
    - apt update && apt install -y docker.io docker-compose openssh-client
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan 49.233.185.174 >> ~/.ssh/known_hosts
  script:
    - ssh root@49.233.185.174 "mkdir -p /home/ubuntu/article-fds"
    - scp docker-compose.yml root@49.233.185.174:/home/ubuntu/article-fds/
    - ssh root@49.233.185.174 "cd /home/ubuntu/article-fds && docker-compose up -d"
  only:
    - feature/initial-commit  # 仅在该分支触发
  tags:
    - docker
