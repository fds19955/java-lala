stages:
  - test-aliyun
  - build-backend
  - build-frontend
  - push-images
  - k3s-deploy

variables:
  KUBE_NAMESPACE: "article-system"
  DOCKER_REGISTRY: "crpi-qaxlisuwj9fp5gv9.cn-beijing.personal.cr.aliyuncs.com"
  DOCKER_NAMESPACE: "fds-article"
  ALIYUN_REGISTRY_USER: "nick1191472774"
  ALIYUN_REGISTRY_PASSWORD: $ALIYUN_REGISTRY_PASSWORD
  MYSQL_ROOT_PASSWORD: $DB_ROOT_PASSWORD
  MYSQL_DATABASE: "article_db"

# ========== 阶段0：阿里云测试 ==========
test-aliyun:
  stage: test-aliyun
  image: docker:24.0.7
  script:
    - |
      echo "$ALIYUN_REGISTRY_PASSWORD" | docker login -u "$ALIYUN_REGISTRY_USER" --password-stdin "$DOCKER_REGISTRY"
  tags:
    - docker

# ========== 阶段1：构建后端 ==========
build-backend:
  stage: build-backend
  image: maven:3.9.8-eclipse-temurin-17
  script:
    - |
      echo "🚀 开始构建后端应用..."
      mkdir -p ~/.m2
      cat > ~/.m2/settings.xml << 'EOF'
      <?xml version="1.0" encoding="UTF-8"?>
      <settings>
        <mirrors>
          <mirror>
            <id>alimaven</id>
            <name>aliyun maven</name>
            <url>https://maven.aliyun.com/repository/public</url>
            <mirrorOf>central</mirrorOf>
          </mirror>
        </mirrors>
      </settings>
      EOF
      cd backend
      mvn clean package -DskipTests
  artifacts:
    paths:
      - backend/target/*.jar
    expire_in: 1 hour
  only:
    - feature/initial-commit
    - main
    - develop
  tags:
    - docker

# ========== 阶段2：构建前端 ==========
build-frontend:
  stage: build-frontend
  image: node:20-alpine
  script:
    - |
      echo "🎨 开始构建前端应用..."
      if [ ! -d "frontend" ]; then
        echo "⚠️ 前端目录不存在，跳过构建"
        exit 0
      fi
      cd frontend
      npm config set registry https://registry.npmmirror.com
      npm install --silent
      npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour
  only:
    - feature/initial-commit
    - main
    - develop
  tags:
    - docker
# ========== 阶段3：推送镜像到阿里云仓库 ==========
push-images:
  stage: push-images
  image: docker:24.0.7
  needs:
    - build-backend
    - build-frontend
  before_script:
    - apk add --no-cache curl
    - docker --version
  script:
    - |
      set -e # 遇到错误立即退出，避免累积错误
      echo "🚀 开始镜像推送流程..."

      # 1. 登录阿里云镜像仓库 (简化判断)
      echo "🔐 登录阿里云镜像仓库..."
      if [ -z "$ALIYUN_REGISTRY_PASSWORD" ]; then
        echo "❌ 错误：环境变量 ALIYUN_REGISTRY_PASSWORD 未设置或为空"
        exit 1
      fi
      echo "$ALIYUN_REGISTRY_PASSWORD" | docker login -u "$ALIYUN_REGISTRY_USER" --password-stdin "$DOCKER_REGISTRY"
      echo "✅ 阿里云仓库登录成功"

      # 2. 构建并推送后端镜像 (使用 echo 逐行创建 Dockerfile，避免 HEREDOC)
      echo "📦 构建后端镜像..."
      echo "FROM eclipse-temurin:17-jre-alpine" > Dockerfile.backend
      echo "WORKDIR /app" >> Dockerfile.backend
      echo "COPY backend/target/*.jar app.jar" >> Dockerfile.backend
      echo "EXPOSE 8080" >> Dockerfile.backend
      echo 'ENTRYPOINT ["java", "-jar", "app.jar"]' >> Dockerfile.backend

      BACKEND_IMAGE_TAG="${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/article-backend:${CI_COMMIT_SHORT_SHA}"
      LATEST_TAG="${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/article-backend:latest"

      docker build -f Dockerfile.backend -t "$BACKEND_IMAGE_TAG" .
      docker tag "$BACKEND_IMAGE_TAG" "$LATEST_TAG"
      echo "✅ 后端镜像构建完成"

      echo "📤 推送后端镜像..."
      docker push "$BACKEND_IMAGE_TAG"
      docker push "$LATEST_TAG"
      echo "✅ 后端镜像推送完成: $BACKEND_IMAGE_TAG"

      # 3. 构建并推送前端镜像（如果存在）- 修复 if 语句结构
      if [ -d "frontend/dist" ] && [ -n "$(ls -A frontend/dist 2>/dev/null)" ]; then
        echo "📦 构建前端镜像..."
        echo "FROM nginx:alpine" > frontend/Dockerfile.frontend
        echo "COPY dist/ /usr/share/nginx/html" >> frontend/Dockerfile.frontend
        echo "COPY nginx.conf /etc/nginx/conf.d/default.conf" >> frontend/Dockerfile.frontend # 这行没加，找bug找好久
        echo "EXPOSE 80" >> frontend/Dockerfile.frontend

        FRONTEND_IMAGE_TAG="${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/article-frontend:${CI_COMMIT_SHORT_SHA}"
        FRONTEND_LATEST="${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/article-frontend:latest"

        docker build -f frontend/Dockerfile.frontend -t "$FRONTEND_IMAGE_TAG" frontend/
        docker tag "$FRONTEND_IMAGE_TAG" "$FRONTEND_LATEST"
        echo "✅ 前端镜像构建完成"

        echo "📤 推送前端镜像..."
        docker push "$FRONTEND_IMAGE_TAG"
        docker push "$FRONTEND_LATEST"
        echo "✅ 前端镜像推送完成"
        FRONTEND_DEPLOY_INFO="前端: ${FRONTEND_IMAGE_TAG}"
      else
        echo "ℹ️ 前端构建产物不存在，跳过前端镜像构建"
        FRONTEND_DEPLOY_INFO="前端: 未构建"
      fi

      # 4. 验证推送
      echo "🔍 验证镜像推送..."
      if docker pull "$BACKEND_IMAGE_TAG"; then
        echo "✅ 后端镜像验证成功"
      else
        echo "❌ 后端镜像验证失败"
        exit 1
      fi

      # 5. 生成报告
      echo ""
      echo "========== 镜像推送报告 =========="
      echo "✅ 推送成功的镜像:"
      docker images | grep "$DOCKER_REGISTRY/$DOCKER_NAMESPACE" || echo "无相关镜像"
      echo ""
      echo "🔗 镜像地址:"
      echo "后端: $BACKEND_IMAGE_TAG"
      echo "$FRONTEND_DEPLOY_INFO"
      echo "✅ 镜像推送阶段完成"
      
  only:
    - feature/initial-commit
    - main
    - develop
  tags:
    - docker

# ========== 阶段4：K3s部署 ==========
# ========== 阶段4：K3s部署 ==========
k3s-deploy:
  stage: k3s-deploy
  # 方案1：使用K3s官方镜像（推荐，与您的K3s环境一致）
  image: rancher/kubectl:v1.29.4
  
  # 方案2：使用更小的Alpine镜像
  # image: alpine/kubectl:1.29.4
  
  # 方案3：使用Bitnami镜像（稳定可靠）
  # image: bitnami/kubectl:1.29.4
  
  # 方案4：直接使用K3s二进制文件（如果Runner上有K3s）
  # image: docker:24.0.7
  
  needs:
    - push-images
  before_script:
    - |
      echo "🚀 准备K3s部署环境..."
      
      # 根据选择的镜像安装必要工具
      if [ "$(cat /etc/os-release | grep -i alpine)" ]; then
        # Alpine系统
        apk add --no-cache gettext bash curl
      else
        # Debian/Ubuntu系统
        apt-get update && apt-get install -y gettext bash curl
      fi
      
      # 配置kubeconfig
      mkdir -p ~/.kube
      if [ -f "/etc/rancher/k3s/k3s.yaml" ]; then
        echo "🔧 配置K3s kubeconfig..."
        cp /etc/rancher/k3s/k3s.yaml ~/.kube/config
        
        # 获取Runner节点IP
        HOST_IP=$(hostname -I | awk '{print $1}')
        echo "📡 使用IP地址: $HOST_IP"
        
        # 更新server地址
        sed -i "s/127.0.0.1/${HOST_IP}/g" ~/.kube/config
        echo "✅ Kubeconfig配置完成"
      else
        echo "⚠️ 未找到k3s.yaml，尝试其他配置方式"
        
        # 尝试从环境变量获取
        if [ -n "$KUBECONFIG" ]; then
          echo "$KUBECONFIG" > ~/.kube/config
          echo "✅ 使用环境变量KUBECONFIG"
        else
          echo "❌ 错误：无法找到kubeconfig配置"
          echo "请确保K3s配置文件存在或设置KUBECONFIG环境变量"
          exit 1
        fi
      fi
      
      # 测试集群连接
      echo "🔍 测试集群连接..."
      kubectl cluster-info && echo "✅ 集群连接成功" || {
        echo "❌ 集群连接失败"
        echo "调试信息："
        kubectl version
        exit 1
      }
      
      kubectl get nodes && echo "✅ 节点信息获取成功" || {
        echo "❌ 无法获取节点信息"
        exit 1
      }
  script:
    - |
      set -e
      echo "🎯 开始K3s部署..."
      
      KUBE_NAMESPACE="article-system"
      
      # 1. 检查必要文件
      echo "📁 检查K8s配置文件..."
      if [ ! -d "k8s" ] || [ -z "$(ls k8s/*.yaml 2>/dev/null)" ]; then
        echo "❌ 错误：未找到K8s配置文件"
        echo "请确保k8s/目录包含必要的yaml文件"
        exit 1
      fi
      
      # 2. 创建命名空间
      echo "📦 创建命名空间..."
      kubectl create namespace $KUBE_NAMESPACE --dry-run=client -o yaml | kubectl apply -f - || echo "命名空间已存在"
      
      # 3. 生成配置目录
      mkdir -p k8s/generated
      
      # 4. 处理secret配置
      echo "🔐 生成secret配置..."
      if [ -f "k8s/secret.yaml" ]; then
        envsubst < k8s/secret.yaml > k8s/generated/secret.yaml
        echo "✅ Secret配置生成完成"
      else
        echo "⚠️ 未找到secret.yaml，跳过"
      fi
      
      # 5. 检查后端镜像是否存在
      echo "🔍 检查后端镜像..."
      BACKEND_IMAGE="${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/article-backend:${CI_COMMIT_SHORT_SHA}"
      
      # 使用curl检查镜像是否存在（避免使用docker命令）
      if curl -s -u "$ALIYUN_REGISTRY_USER:$ALIYUN_REGISTRY_PASSWORD" \
        "https://crpi-qaxlisuwj9fp5gv9.cn-beijing.personal.cr.aliyuncs.com/v2/fds-article/article-backend/tags/list" | \
        grep -q "${CI_COMMIT_SHORT_SHA}"; then
        echo "✅ 找到后端镜像: $BACKEND_IMAGE"
        
        # 处理deployment配置
        if [ -f "k8s/backend-deployment.yaml" ]; then
          sed -e "s|\\\${DOCKER_REGISTRY}|${DOCKER_REGISTRY}|g" \
              -e "s|\\\${DOCKER_NAMESPACE}|${DOCKER_NAMESPACE}|g" \
              -e "s|\\\${CI_COMMIT_SHORT_SHA}|${CI_COMMIT_SHORT_SHA}|g" \
              k8s/backend-deployment.yaml > k8s/generated/backend-deployment.yaml
          echo "✅ 后端Deployment配置生成完成"
        fi
      else
        echo "❌ 错误：未找到后端镜像 $BACKEND_IMAGE"
        echo "请先确保push-images阶段成功执行"
        exit 1
      fi
      
      # 6. 部署基础资源
      echo "🚀 部署基础资源..."
      
      # 按顺序部署资源
      for resource in configmap secret; do
        if [ -f "k8s/generated/${resource}.yaml" ]; then
          kubectl apply -f "k8s/generated/${resource}.yaml" && echo "✅ ${resource}部署成功"
        elif [ -f "k8s/${resource}.yaml" ]; then
          kubectl apply -f "k8s/${resource}.yaml" && echo "✅ ${resource}部署成功"
        fi
      done
      
      # 7. 部署数据库（如果配置文件存在）
      if [ -f "k8s/mysql-master.yaml" ]; then
        echo "🐬 部署MySQL数据库..."
        kubectl apply -f k8s/mysql-master.yaml && echo "✅ MySQL主节点部署成功"
        
        # 等待数据库就绪
        echo "⏳ 等待MySQL启动..."
        if kubectl wait --for=condition=ready pod -l app=mysql -n $KUBE_NAMESPACE --timeout=300s 2>/dev/null; then
          echo "✅ MySQL就绪"
        else
          echo "⚠️ MySQL启动超时，继续部署..."
        fi
      else
        echo "ℹ️ 跳过MySQL部署（配置文件不存在）"
      fi
      
      # 8. 部署Redis（如果配置文件存在）
      if [ -f "k8s/redis.yaml" ]; then
        echo "🔴 部署Redis..."
        kubectl apply -f k8s/redis.yaml && echo "✅ Redis部署成功"
      else
        echo "ℹ️ 跳过Redis部署（配置文件不存在）"
      fi
      
      # 9. 部署后端应用
      echo "🚀 部署后端应用..."
      if [ -f "k8s/generated/backend-deployment.yaml" ]; then
        kubectl apply -f k8s/generated/backend-deployment.yaml && echo "✅ 后端应用部署成功"
        
        # 等待应用就绪
        echo "⏳ 等待后端应用启动..."
        if kubectl wait --for=condition=ready pod -l app=article-backend -n $KUBE_NAMESPACE --timeout=180s 2>/dev/null; then
          echo "✅ 后端应用就绪"
        else
          echo "⚠️ 后端应用启动超时"
        fi
      else
        echo "❌ 错误：未找到后端Deployment配置"
        exit 1
      fi
      
      # 10. 部署网络服务（如果配置文件存在）
      if [ -f "k8s/ingress.yaml" ]; then
        echo "🌐 部署Ingress..."
        kubectl apply -f k8s/ingress.yaml && echo "✅ Ingress部署成功"
      fi
      
      if [ -f "k8s/hpa.yaml" ]; then
        echo "📊 部署HPA..."
        kubectl apply -f k8s/hpa.yaml && echo "✅ HPA部署成功"
      fi
      
      # 11. 部署验证
      echo "🧪 部署验证..."
      echo "=== Pod状态 ==="
      kubectl get pods -n $KUBE_NAMESPACE -o wide
      
      echo "=== 服务状态 ==="
      kubectl get svc -n $KUBE_NAMESPACE
      
      echo "=== 部署状态 ==="
      kubectl get deployments -n $KUBE_NAMESPACE
      
      # 12. 健康检查
      echo "❤️ 健康检查..."
      BACKEND_POD=$(kubectl get pods -n $KUBE_NAMESPACE -l app=article-backend -o name 2>/dev/null | head -1)
      if [ -n "$BACKEND_POD" ]; then
        echo "🔍 检查后端Pod: $BACKEND_POD"
        if kubectl exec -n $KUBE_NAMESPACE $BACKEND_POD -- sh -c "wget -q -O- http://localhost:8080/actuator/health" | grep -q "UP"; then
          echo "✅ 后端服务健康检查通过"
        else
          echo "⚠️ 后端服务健康检查失败"
          echo "查看Pod日志："
          kubectl logs -n $KUBE_NAMESPACE $BACKEND_POD --tail=20
        fi
      else
        echo "⚠️ 未找到后端Pod"
      fi
      
      # 13. 生成报告
      echo ""
      echo "========== K3s部署完成报告 =========="
      echo "🎉 部署流程完成!"
      echo ""
      echo "📊 集群信息:"
      kubectl get nodes -o wide
      echo ""
      echo "🔧 后续操作:"
      echo "  查看详细状态: kubectl get all -n $KUBE_NAMESPACE"
      echo "  查看Pod日志: kubectl logs -f deployment/article-backend -n $KUBE_NAMESPACE"
      echo "  进入Pod调试: kubectl exec -it deployment/article-backend -n $KUBE_NAMESPACE -- sh"
      echo ""
      echo "✅ K3s部署阶段执行完成"
  only:
    - feature/initial-commit
    - main
    - develop
  tags:
    - docker
