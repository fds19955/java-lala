apiVersion: v1
kind: ConfigMap
  name: app-config
  namespace: article-system
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-master.article-system.svc.cluster.local:3306/article_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai"
  SPRING_DATASOURCE_READONLY_URL: "jdbc:mysql://mysql-slave.article-system.svc.cluster.local:3306/article_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false"
  SPRING_REDIS_HOST: "redis.article-system.svc.cluster.local"
  SPRING_REDIS_PORT: "6379"
  SERVER_PORT: "8080"
