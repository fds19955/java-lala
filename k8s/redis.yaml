apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: article-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        command:
        - redis-server
        - "--maxmemory 512mb"
        - "--maxmemory-policy allkeys-lru"
        - "--appendonly yes"

---
apiVersion: v1
kind: Service
  name: redis
  namespace: article-system
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis
