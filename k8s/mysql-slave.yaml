apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-slave
  namespace: article-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
      role: slave
  template:
    metadata:
      labels:
        app: mysql
        role: slave
    spec:
      nodeSelector:
        node-type: aliyun
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: mysql-root-password
        command:
        - bash
        - -c
        - |
          set -e
          # 等待主节点就绪
          until nc -z mysql-master.article-system.svc.cluster.local 3306; do
            echo "等待主MySQL启动..."
            sleep 5
          done
          
          # 启动MySQL
          docker-entrypoint.sh mysqld &
          sleep 30
          
          # 配置主从复制
          mysql -uroot -p$MYSQL_ROOT_PASSWORD -e "
            CHANGE MASTER TO
            MASTER_HOST='mysql-master.article-system.svc.cluster.local',
            MASTER_USER='repl',
            MASTER_PASSWORD='$MYSQL_REPLICATION_PASSWORD',
            MASTER_AUTO_POSITION=1;
            START SLAVE;
          "
          wait
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: mysql-data
        persistentVolumeClaim:
          claimName: mysql-slave-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
  name: mysql-slave-pvc
  namespace: article-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: Service
  name: mysql-slave
  namespace: article-system
spec:
  ports:
  - port: 3306
    targetPort: 3306
  selector:
    app: mysql
    role: slave
