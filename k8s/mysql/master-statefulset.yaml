apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-master
  namespace: article-system
spec:
  serviceName: mysql-master
  replicas: 1
  selector:
    matchLabels:
      app: mysql-master
  template:
    metadata:
      labels:
        app: mysql-master
    spec:
      nodeSelector:
        high-perf: "true"  # 调度到高性能节点（腾讯云）
      containers:
      - name: mysql
        image: swr.cn-north-1.myhuaweicloud.com/library/mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: root-password
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: local-path  # 使用k3s默认存储
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-master
  namespace: article-system
spec:
  ports:
  - port: 3306
  selector:
    app: mysql-master
