apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: article-ingress
  namespace: article-system
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: article-frontend
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: article-backend
            port:
              number: 8080
