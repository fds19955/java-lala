 
version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# 网络配置 - 所有服务在同一网络
networks:
  article-network:
    driver: bridge
    ipam:
      config:
        - subnet: "172.20.0.0/24"

# 数据卷配置
volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

# 服务定义
services:
  # 1. MySQL数据库服务
  mysql:
    image: mysql:8.0
    container_name: article-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fds00913}
      MYSQL_DATABASE: article_db
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - article-network
    logging: *default-logging
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --sql-mode=""
      --max_connections=1000

  # 2. Redis缓存服务
  redis:
    image: redis:7-alpine
    container_name: article-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: 
      - redis-server
      - --maxmemory 512mb
      - --maxmemory-policy allkeys-lru
      - --requirepass ${REDIS_PASSWORD:-redispass123}
      - --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispass123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - article-network
    logging: *default-logging

  # 3. 后端应用服务（Spring Boot）
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${CI_COMMIT_SHORT_SHA:-latest}
    image: article-backend:${CI_COMMIT_SHORT_SHA:-latest}
    container_name: article-backend
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/article_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fds00913}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-redispass123}
      SERVER_PORT: 8080
      JAVA_OPTS: -Xmx512m -Xms256m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - article-network
    logging: *default-logging
    volumes:
      - ./backend/logs:/app/logs:rw

  # 4. 前端应用服务（Nginx）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    image: article-frontend:${CI_COMMIT_SHORT_SHA:-latest}
    container_name: article-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      BACKEND_API_URL: http://backend:8080
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - article-network
    logging: *default-logging
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/ssl:/etc/nginx/ssl:ro
      - frontend-logs:/var/log/nginx

volumes:
  mysql-data:
  redis-data:
  frontend-logs:
 
