services:
  mysql-db:
    image: mysql:8.0
    container_name: article-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: fds00913
      MYSQL_DATABASE: article_db
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend-app:
    image: 49.233.185.174:8929/fds/java-lala:latest  # 你的GitLab镜像地址
    container_name: article-backend
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/article_db?useSSL=false&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: fds00913
    depends_on:
      mysql-db:
        condition: service_healthy  # 等待MySQL健康检查通过后再启动
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      timeout: 10s
      retries: 5

networks:
  app-network:
    driver: bridge
