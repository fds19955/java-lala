version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: article-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: fds00913
      MYSQL_DATABASE: article_db
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql  # 使用命名卷持久化数据
      - ./mysql/init:/docker-entrypoint-initdb.d  # 初始化脚本目录（如果有的话）
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend-app:
    image: 49.233.185.174:5000/fds/java-lala:latest  # 从GitLab Registry拉取镜像
    container_name: article-backend
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/article_db?useSSL=false&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: fds00913
      SPRING_REDIS_HOST: article-redis  # 连接服务器上的Redis
      SPRING_REDIS_PORT: 6379
    depends_on:
      mysql-db:
        condition: service_healthy  # 等待MySQL健康检查通过后再启动
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      timeout: 10s
      retries: 5

# 命名卷，用于持久化MySQL数据
volumes:
  mysql-data:

networks:
  app-network:
    driver: bridge
    external: false
